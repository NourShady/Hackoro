<!DOCTYPE html>
<html>
<head>
  <title>VR Frame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-video-shader@5.0.0/dist/aframe-video-shader.min.js"></script>
  <style>
    body { margin: 0; background: black; }
    #startBtn {
      position: absolute;
      z-index: 10;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<!-- زر التشغيل -->
<button id="startBtn">Start VR</button>

<!-- الفيديو الخفي المستخدم كـ texture -->
<video id="vid" autoplay muted playsinline style="display: none;" crossorigin="anonymous"></video>

<!-- مشهد A-Frame -->
<a-scene>
  <a-assets>
    <video id="vidAsset" autoplay loop="true" muted playsinline crossorigin="anonymous"></video>
  </a-assets>

<a-video 
  id="videoPlane"
  src="#vidAsset"
  width="10"
  height="6"
  position="0 1.6 -1.5"
  shader="flat">
</a-video>
</a-scene>

<script>
  let streamReady = false;

  // استقبال الرسالة من الصفحة الأم
  window.addEventListener("message", (event) => {
    if (event.data.type === "initStream") {
      const stream = parent.sharedStream;
      if (!stream) return console.warn("No stream received.");
      window.receivedStream = stream;
      streamReady = true;
      console.log("✅ Stream received. Ready for user click.");
    }
  });

  // تشغيل الفيديو وتطبيقه على a-video عند الضغط
  document.getElementById("startBtn").addEventListener("click", () => {
    if (!streamReady || !window.receivedStream) {
      return alert("⏳ Stream not ready yet. Please wait...");
    }

    const videoEl = document.getElementById("vid");
    const assetVideo = document.getElementById("vidAsset");

    // إعداد الفيديو
    videoEl.srcObject = window.receivedStream;
    assetVideo.srcObject = window.receivedStream;

    videoEl.onloadedmetadata = () => {
      videoEl.play();
      assetVideo.play();

      console.log("▶️ Video playing");

      // إخفاء الزر بعد التشغيل
      document.getElementById("startBtn").style.display = "none";
    };
  });
</script>

</body>
</html>
