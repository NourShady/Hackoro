<!DOCTYPE html>
<html>
<head>
  <title>VR Frame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    body { margin: 0; background: black; }
  </style>
</head>
<body>
<button id="startBtn" style="position: absolute; z-index: 10;">Start VR</button>

<!-- الفيديو الذي سيُستخدم كـ Texture -->
<video id="vid" autoplay muted playsinline style="display: none;"></video>

<!-- مشهد A-Frame -->
<a-scene>
  <a-entity id="videoPlane"
            geometry="primitive: plane; height: 2; width: 3"
            position="0 1.6 -4">
  </a-entity>
</a-scene>
<script>
  let streamReady = false;

  // نستلم الستريم من الصفحة الأم
  window.addEventListener("message", (event) => {
    if (event.data.type === "initStream") {
      const stream = parent.sharedStream;
      if (!stream) return console.warn("No stream received yet.");
      window.receivedStream = stream;
      streamReady = true;
      console.log("Stream received. Waiting for user click.");
    }
  });

  // عند الضغط على الزر
  document.getElementById("startBtn").addEventListener("click", () => {
    if (!streamReady || !window.receivedStream) {
      return alert("Stream not ready yet. Please wait.");
    }

    const videoEl = document.getElementById("vid");
    videoEl.muted = true;
    videoEl.srcObject = window.receivedStream;

    videoEl.onloadedmetadata = () => {
      videoEl.play().then(() => {
        console.log("Video is playing via user interaction");

        const scene = document.querySelector("a-scene");
        const mesh = document.querySelector("#videoPlane").getObject3D("mesh");
        if (!mesh) return console.warn("Mesh not found");

        const videoTexture = new THREE.VideoTexture(videoEl);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.format = THREE.RGBFormat;

        mesh.material.map = videoTexture;
        mesh.material.needsUpdate = true;

        console.log("Texture applied to mesh");
      }).catch(err => console.warn("Autoplay error", err));
    };
  });
</script>


</body>
</html>
