<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* iframe {
      width: 50%;
      height: 50vh;
      border: none;
      scale: 1;
    } */
    #bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      border: none;
    }

    .iframe-wrapper {
      position: relative;
      width: 50px;
      height: 50px;
      border: 2px solid #ccc;
      overflow: hidden;
      z-index: 1000;
    }

    .iframe-wrapper iframe {
      width: 270%;
      height: 300%;
      border: none;
      scale: 0.7;
      margin-left: -40%;
      margin-top: -17%;
    }

    .resizer {
      position: absolute;
      width: 50px;
      height: 50px;
      right: 0;
      bottom: 0;
      background: #101010;
      cursor: se-resize;
      touch-action: none;
    }
  </style>
   <style>
    #fullscreen-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      padding: 12px 16px;
      background-color: #101010;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    #fullscreen-btn:active {
      background-color: #101010;
    }
  </style>
</head>

<body>
  <iframe id="bg" src="https://flipclock.app/" frameborder="0"></iframe>
  <div class="iframe-wrapper" id="iframeContainer">

    <iframe src="http://192.168.1.4:9510/client/" frameborder="0"></iframe>
    <div class="resizer" id="resizerHandle"></div>
  </div>

  <video id="stayAwakeVideo" autoplay muted loop playsinline style="display: none;">
  <source src="data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDFtcDQyaXNvbQAAAA...==">
</video>


  <button id="fullscreen-btn">⛶</button>

  <script>
    const btn = document.getElementById('fullscreen-btn');

    btn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`Error attempting to enable full-screen mode: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });
  </script>

  <script>
    const resizer = document.getElementById("resizerHandle");
    const container = document.getElementById("iframeContainer");

    let startX, startY, startWidth, startHeight;

    function startResize(e) {
      e.preventDefault();
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      startY = e.touches ? e.touches[0].clientY : e.clientY;
      startWidth = container.offsetWidth;
      startHeight = container.offsetHeight;

      document.addEventListener("touchmove", resize);
      document.addEventListener("touchend", stopResize);
      document.addEventListener("mousemove", resize);
      document.addEventListener("mouseup", stopResize);
    }

    function resize(e) {
      const currentX = e.touches ? e.touches[0].clientX : e.clientX;
      const currentY = e.touches ? e.touches[0].clientY : e.clientY;

      container.style.width = startWidth + (currentX - startX) + "px";
      container.style.height = startHeight + (currentY - startY) + "px";
    }

    function stopResize() {
      document.removeEventListener("mousemove", resize);
      document.removeEventListener("mouseup", stopResize);
      document.removeEventListener("touchmove", resize);
      document.removeEventListener("touchend", stopResize);
    }

    resizer.addEventListener("mousedown", startResize);
    resizer.addEventListener("touchstart", startResize);
  </script>
</body>

</html>
