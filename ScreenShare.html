<!DOCTYPE html>
<html>

<head>
  <title>WebRTC Firebase</title>
  <style>
     body{
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #333333;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      color: white;
    }
    video{
      width: 70%;
      /* border: 1px solid white; */
      /* border-radius: 20px; */
    }
    button{
      margin: 20px;
      font-size: 32px;
      background-color: white;
      padding: 10px;
      border: none;
      /* width: 50%; */
      border-radius: 10px;
    }
    button:hover{
      background-color: rgb(187, 186, 186);

    }
</style>
</head>

<body>
  <h2>Hackoro Screen Share with Firebase</h2>
  <video src="" id="vid"></video>
  <div>
    <button id="start">Start Screen Share</button>
    <button id="join">Join</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <!-- <script src="main.js"></script> -->
  <script>// Replace this with your own Firebase project config
    const firebaseConfig = {
      apiKey: "AIzaSyCgjFG8b39I9_AdE9kvGzwH7Cnx_Ym_qoY",
      authDomain: "hackoro-screen-share.firebaseapp.com",
      projectId: "hackoro-screen-share",
      storageBucket: "hackoro-screen-share.firebasestorage.app",
      messagingSenderId: "613738987554",
      appId: "1:613738987554:web:3e9f0e57f67b1c8f70ca7b",
      measurementId: "G-DFFEH8K202",
      databaseURL: "https://hackoro-screen-share-default-rtdb.firebaseio.com/" // Replace with your actual URL
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const roomId = "your-room-id";
    const roomRef = db.ref(`rooms/${roomId}`);
    let peerConnection;
    let localStream;

    const servers = {
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    };

    function createPeerConnection(isCaller) {
      peerConnection = new RTCPeerConnection(servers);

      peerConnection.onicecandidate = event => {
        if (event.candidate) {
          const candidateType = isCaller ? "offerCandidates" : "answerCandidates";
          roomRef.child(candidateType).push({
            type: isCaller ? "offerCandidate" : "answerCandidate",
            candidate: event.candidate.toJSON()
          });
        }
      };

      peerConnection.ontrack = event => {
        const remoteVideo = document.getElementById("vid")
        remoteVideo.srcObject = event.streams[0];
        remoteVideo.autoplay = true;
        remoteVideo.controls = true;
        // remoteVideo.style.width = "400px";
        // document.body.appendChild(remoteVideo);
      };
    }

    async function startScreenSharing() {
      localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    }

    document.getElementById("start").onclick = async () => {
      createPeerConnection(true);
      await startScreenSharing();

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      await roomRef.set({ offer: { type: offer.type, sdp: offer.sdp } });

      // Listen for answer
      roomRef.child("answer").on("value", async snapshot => {
        const data = snapshot.val();
        if (data && data.type && data.sdp && !peerConnection.currentRemoteDescription) {
          const answer = new RTCSessionDescription(data);
          await peerConnection.setRemoteDescription(answer);
        }
      });

      // Listen for answer ICE candidates
      roomRef.child("answerCandidates").on("child_added", snapshot => {
        const data = snapshot.val();
        if (data && data.candidate) {
          peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      });
    };

    document.getElementById("join").onclick = async () => {
      createPeerConnection(false);

      const snapshot = await roomRef.child("offer").get();
      const offer = snapshot.val();
      if (!offer || !offer.type || !offer.sdp) {
        alert("No valid offer found yet.");
        return;
      }

      await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));



      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      await roomRef.child("answer").set({
        type: answer.type,
        sdp: answer.sdp
      });

      // Listen for offer ICE candidates
      roomRef.child("offerCandidates").on("child_added", snapshot => {
        const data = snapshot.val();
        if (data && data.candidate) {
          peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      });
    };</script>
</body>

</html>
