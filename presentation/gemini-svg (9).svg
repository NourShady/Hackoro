<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#080c17" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000204" />
    </radialGradient>

    <!-- Pillar Glows -->
    <radialGradient id="ml-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="qt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="qi-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-orange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Animations */
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes dataPulse {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes particleFlowLeft {
      0% { transform: translate(210px, 310px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(500px, 310px); opacity: 0; }
    }
    @keyframes particleFlowRight {
      0% { transform: translate(500px, 310px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(790px, 310px); opacity: 0; }
    }

    .orbit-cw { transform-origin: center; animation: spinClockwise 10s linear infinite; }
    .orbit-ccw { transform-origin: center; animation: spinCounter 14s linear infinite; }
    .pulse-orange { animation: pulseGlow 4s ease-in-out infinite; }
    .pulse-cyan { animation: pulseGlow 4s ease-in-out infinite 1.3s; }
    .pulse-green { animation: pulseGlow 4s ease-in-out infinite 2.6s; }
  </style>

  <!-- Deep Space Grid Background -->
  <rect width="1000" height="650" fill="url(#bg-grad)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  <!-- Main Header Title -->
  <text x="500" y="45" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#ffffff" filter="url(#glow-cyan)">9. CONNECTION TO AI &amp;COMPUTER SCIENCE</text>
  <text x="500" y="70" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="600" fill="#00ff88" letter-spacing="1.5">INTEGRATING MACHINE LEARNING, QUANTUM TELEPORTATION &amp;THE QUANTUM INTERNET</text>

  <!-- ================= CONNECTING DATA PIPELINES ================= -->
  <!-- Left Pipeline: ML <-> Quantum Teleportation -->
  <path d="M 210,310 C 300,230 410,230 500,310" fill="none" stroke="#ff9800" stroke-width="2.5" opacity="0.5" stroke-dasharray="6 6" />
  <path d="M 210,310 C 300,390 410,390 500,310" fill="none" stroke="#00f3ff" stroke-width="2.5" opacity="0.8" stroke-dasharray="10 10" style="animation: dataPulse 6s linear infinite;" />

  <!-- Right Pipeline: Quantum Teleportation <-> Quantum Internet &amp;Distributed Computing -->
  <path d="M 500,310 C 590,230 700,230 790,310" fill="none" stroke="#00f3ff" stroke-width="2.5" opacity="0.8" stroke-dasharray="10 10" style="animation: dataPulse 6s linear infinite;" />
  <path d="M 500,310 C 590,390 700,390 790,310" fill="none" stroke="#00ff88" stroke-width="2.5" opacity="0.5" stroke-dasharray="6 6" />

  <!-- Travelling Data Stream Signals -->
  <g style="animation: particleFlowLeft 3s linear infinite;">
    <circle cx="0" cy="0" r="5" fill="#ff9800" filter="url(#glow-orange)" />
  </g>
  <g style="animation: particleFlowRight 3s linear infinite 1.5s;">
    <circle cx="0" cy="0" r="5" fill="#00ff88" filter="url(#glow-green)" />
  </g>

  <!-- ================= PILLAR 1: MACHINE LEARNING (LEFT - ORANGE) ================= -->
  <g transform="translate(210, 310)">
    <circle cx="0" cy="0" r="115" fill="url(#ml-glow)" class="pulse-orange" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="6 4" class="orbit-cw" opacity="0.6" />

    <!-- Neural Network Node Graphic -->
    <g stroke="#ff9800" stroke-width="1.2" opacity="0.7">
      <line x1="-30" y1="-20" x2="0" y2="-35" />
      <line x1="-30" y1="-20" x2="0" y2="0" />
      <line x1="-30" y1="20" x2="0" y2="0" />
      <line x1="-30" y1="20" x2="0" y2="35" />
      <line x1="0" y1="-35" x2="30" y2="-10" />
      <line x1="0" y1="0" x2="30" y2="-10" />
      <line x1="0" y1="0" x2="30" y2="25" />
      <line x1="0" y1="35" x2="30" y2="25" />
    </g>
    <!-- Nodes -->
    <circle cx="-30" cy="-20" r="5" fill="#ff9800" filter="url(#glow-orange)" />
    <circle cx="-30" cy="20" r="5" fill="#ff9800" filter="url(#glow-orange)" />
    <circle cx="0" cy="-35" r="5" fill="#ffffff" />
    <circle cx="0" cy="0" r="6" fill="#ff9800" filter="url(#glow-intense)" />
    <circle cx="0" cy="35" r="5" fill="#ffffff" />
    <circle cx="30" cy="-10" r="5" fill="#ff9800" filter="url(#glow-orange)" />
    <circle cx="30" cy="25" r="5" fill="#ff9800" filter="url(#glow-orange)" />

    <!-- Pillar Header -->
    <rect x="-85" y="-140" width="170" height="26" rx="6" fill="#140b02" stroke="#ff9800" stroke-width="1.2" />
    <text x="0" y="-123" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="700" fill="#ff9800" letter-spacing="1">MACHINE LEARNING</text>

    <!-- Subtext Details -->
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" text-anchor="middle">
      <text x="0" y="115" font-weight="700" fill="#ff9800">QML &amp;Error Mitigation</text>
      <text x="0" y="133" fill="#d9a779">Optimizing Teleportation Gates</text>
      <text x="0" y="148" fill="#d9a779">Adaptive Noise Suppression</text>
    </g>
  </g>


  <!-- ================= PILLAR 2: QUANTUM TELEPORTATION CORE (CENTER - CYAN) ================= -->
  <g transform="translate(500, 310)">
    <circle cx="0" cy="0" r="125" fill="url(#qt-glow)" class="pulse-cyan" />
    <ellipse cx="0" cy="0" rx="90" ry="30" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="6 4" class="orbit-cw" opacity="0.7" />
    <ellipse cx="0" cy="0" rx="90" ry="30" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="8 6" class="orbit-ccw" opacity="0.7" />

    <!-- Quantum State Bloch Core -->
    <circle cx="0" cy="0" r="30" fill="#041624" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan)" />
    <text x="0" y="7" text-anchor="middle" font-family="&#39;Georgia&#39;, serif" font-style="italic" font-size="20" font-weight="bold" fill="#ffffff" filter="url(#glow-intense)">|Ψ⟩</text>

    <!-- Pillar Header -->
    <rect x="-95" y="-140" width="190" height="26" rx="6" fill="#04121a" stroke="#00f3ff" stroke-width="1.2" />
    <text x="0" y="-123" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="700" fill="#00f3ff" letter-spacing="1">QUANTUM TELEPORTATION</text>

    <!-- Subtext Details -->
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" text-anchor="middle">
      <text x="0" y="115" font-weight="700" fill="#00f3ff">Core Protocol Layer</text>
      <text x="0" y="133" fill="#80fbff">Entanglement &amp;BSM</text>
      <text x="0" y="148" fill="#80fbff">State Transfer Engine</text>
    </g>
  </g>


  <!-- ================= PILLAR 3: QUANTUM INTERNET &amp;DISTRIBUTED COMPUTING (RIGHT - GREEN) ================= -->
  <g transform="translate(790, 310)">
    <circle cx="0" cy="0" r="115" fill="url(#qi-glow)" class="pulse-green" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="8 4" class="orbit-ccw" opacity="0.6" />

    <!-- Distributed Mesh Graphic -->
    <g stroke="#00ff88" stroke-width="1.2" opacity="0.7" fill="none">
      <polygon points="0,-32 -28,18 28,18" />
      <line x1="0" y1="-32" x2="0" y2="0" />
      <line x1="-28" y1="18" x2="0" y2="0" />
      <line x1="28" y1="18" x2="0" y2="0" />
      <circle cx="0" cy="0" r="18" stroke="#00ff88" stroke-dasharray="3 3" />
    </g>
    <circle cx="0" cy="-32" r="5" fill="#00ff88" filter="url(#glow-green)" />
    <circle cx="-28" cy="18" r="5" fill="#00ff88" filter="url(#glow-green)" />
    <circle cx="28" cy="18" r="5" fill="#00ff88" filter="url(#glow-green)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#glow-intense)" />

    <!-- Pillar Header -->
    <rect x="-105" y="-140" width="210" height="26" rx="6" fill="#021a10" stroke="#00ff88" stroke-width="1.2" />
    <text x="0" y="-123" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" font-weight="700" fill="#00ff88" letter-spacing="0.8">QUANTUM INTERNET &amp;DQC</text>

    <!-- Subtext Details -->
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" text-anchor="middle">
      <text x="0" y="115" font-weight="700" fill="#00ff88">Distributed Quantum Computing</text>
      <text x="0" y="133" fill="#a3ffce">Modular Quantum Processors</text>
      <text x="0" y="148" fill="#a3ffce">Ultra-Secure Quantum Cloud</text>
    </g>
  </g>


  <!-- ================= BOTTOM ARABIC / ENGLISH SUMMARY PANEL ================= -->
  <g transform="translate(500, 575)">
    <rect x="-420" y="-24" width="840" height="46" rx="8" fill="#050a14" stroke="#1a2d48" stroke-width="1.5" />
    
    <!-- Arabic Description Line -->
    <text x="0" y="-5" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#00f3ff">
      الربط بين تعلم الآلة والإنترنت الكمي: تحسين كفاءة النقل وتوزيع الحوسبة الكمية عبر الشبكات
    </text>
    
    <!-- English Scientific Context Line -->
    <text x="0" y="13" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" fill="#7d9ec0">
      ML optimizes gate fidelity while Quantum Teleportation powers Distributed Quantum Networks &amp;Cloud QPUs
    </text>
  </g>
</svg>