<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bg-grad-s4" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    
    <radialGradient id="tesla-dome-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#9c27b0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="tower-ambient-s4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    
    <filter id="glow-cyan-s4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-amber-s4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense-s4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Wireless Electromagnetic Wave Expansion */
    @keyframes wirelessRipple1 {
      0% { r: 28; opacity: 0.9; stroke-width: 2.5; }
      100% { r: 145; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes wirelessRipple2 {
      0% { r: 28; opacity: 0.9; stroke-width: 2.5; }
      100% { r: 145; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes wirelessRipple3 {
      0% { r: 28; opacity: 0.9; stroke-width: 2.5; }
      100% { r: 145; opacity: 0; stroke-width: 0.5; }
    }

    /* Electric Arc Flicker */
    @keyframes arcFlicker {
      0%, 100% { opacity: 0.2; }
      15% { opacity: 1; }
      20% { opacity: 0.3; }
      45% { opacity: 0.95; }
      52% { opacity: 0.1; }
      78% { opacity: 0.9; }
      85% { opacity: 0.2; }
    }

    /* Dome Core Pulse */
    @keyframes domePulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    /* Clarifying Badge Pulse */
    @keyframes notePulse {
      0%, 100% { stroke-opacity: 0.7; }
      50% { stroke-opacity: 1; }
    }

    .ripple-1 { animation: wirelessRipple1 4.5s ease-out infinite; }
    .ripple-2 { animation: wirelessRipple2 4.5s ease-out infinite 1.5s; }
    .ripple-3 { animation: wirelessRipple3 4.5s ease-out infinite 3s; }
    .arc-flash { animation: arcFlicker 3.2s linear infinite; }
    .dome-core { transform-origin: 0px -75px; animation: domePulse 2.8s ease-in-out infinite; }
    .note-border { animation: notePulse 3s ease-in-out infinite; }
  </style>

  
  <rect width="1000" height="650" fill="url(#bg-grad-s4)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  
  
  <g transform="translate(500, 32)">
    <rect x="-125" y="-13" width="250" height="24" rx="12" fill="#061224" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" letter-spacing="2" fill="#00f3ff">SLIDE 04   |   SPEAKER 03</text>
  </g>

  
  <text x="500" y="76" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="30" font-weight="900" letter-spacing="5" fill="#ffffff" filter="url(#glow-cyan-s4)">NIKOLA TESLA'S VISION</text>

  
  <text x="500" y="102" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#7d9ec0">WIRELESS ENERGY PIONEER &amp; HISTORIC AMBITION</text>

  
  <g transform="translate(275, 345)">
    <circle cx="0" cy="-20" r="175" fill="url(#tower-ambient-s4)" />
    <rect x="-195" y="-205" width="390" height="410" rx="16" fill="#050b16" stroke="#00f3ff" stroke-width="1.8" stroke-opacity="0.75" />

    
    <rect x="-115" y="-185" width="230" height="26" rx="13" fill="#041524" stroke="#00f3ff" stroke-width="1.2" />
    <text x="0" y="-168" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#00f3ff">WARDENCLYFFE TOWER (1901)</text>

    
    <g transform="translate(0, -68)">
      <circle cx="0" cy="0" r="110" fill="url(#tesla-dome-glow)" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#00f3ff" class="ripple-1" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#e040fb" class="ripple-2" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#00f3ff" class="ripple-3" />

      
      <g stroke="#ffffff" stroke-width="1.8" fill="none" filter="url(#glow-intense-s4)" class="arc-flash">
        <polyline points="-26,-8 -48,-24 -62,-16 -82,-34" />
        <polyline points="26,-8 46,-26 64,-18 84,-36" />
        <polyline points="0,-28 -10,-52 8,-68 -6,-88" />
        <polyline points="-20,16 -42,28 -55,22 -74,38" />
        <polyline points="20,16 42,28 56,22 76,38" />
      </g>
    </g>

    
    <g transform="translate(0, 10)">
      
      <line x1="-110" y1="125" x2="110" y2="125" stroke="#00f3ff" stroke-width="2" opacity="0.6" />
      <rect x="-65" y="113" width="130" height="12" rx="3" fill="#07192b" stroke="#00f3ff" stroke-width="1.5" />

      
      <g stroke="#00f3ff" stroke-width="1.8" fill="none">
        
        <line x1="-52" y1="113" x2="-22" y2="-45" />
        <line x1="52" y1="113" x2="22" y2="-45" />
        
        <line x1="-26" y1="113" x2="-11" y2="-45" stroke-opacity="0.5" />
        <line x1="26" y1="113" x2="11" y2="-45" stroke-opacity="0.5" />

        
        <line x1="-45" y1="75" x2="45" y2="75" />
        <line x1="-38" y1="35" x2="38" y2="35" />
        <line x1="-30" y1="-5" x2="30" y2="-5" />
        <line x1="-22" y1="-45" x2="22" y2="-45" />

        
        <g stroke-width="1.1" stroke-opacity="0.65">
          <line x1="-52" y1="113" x2="45" y2="75" />
          <line x1="52" y1="113" x2="-45" y2="75" />
          <line x1="-45" y1="75" x2="38" y2="35" />
          <line x1="45" y1="75" x2="-38" y2="35" />
          <line x1="-38" y1="35" x2="30" y2="-5" />
          <line x1="38" y1="35" x2="-30" y2="-5" />
          <line x1="-30" y1="-5" x2="22" y2="-45" />
          <line x1="30" y1="-5" x2="-22" y2="-45" />
        </g>
      </g>

      
      <g class="dome-core">
        <path d="M -32,-48 C -36,-92 36,-92 32,-48 Z" fill="#062136" stroke="#00f3ff" stroke-width="2.2" filter="url(#glow-cyan-s4)" />
        <ellipse cx="0" cy="-48" rx="32" ry="7" fill="#092d47" stroke="#00f3ff" stroke-width="1.5" />
        
        <path d="M -16,-48 C -18,-82 18,-82 16,-48" fill="none" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
        <line x1="0" y1="-81" x2="0" y2="-48" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
      </g>
    </g>

    
    <text x="0" y="162" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#00f3ff">SHOREHAM, NEW YORK • 187 FT</text>
    <text x="0" y="180" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10.5" fill="#7d9ec0">Classical Electromagnetic Transmission</text>
  </g>

  
  <g transform="translate(715, 345)">
    <rect x="-215" y="-205" width="430" height="410" rx="16" fill="#070c17" stroke="#1e2d42" stroke-width="1.8" />

    
    <rect x="-120" y="-185" width="240" height="28" rx="14" fill="#0a1628" stroke="#00f3ff" stroke-width="1.2" />
    <text x="0" y="-167" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#ffffff">NIKOLA TESLA</text>

    
    <g transform="translate(0, -112)">
      <rect x="-190" y="-28" width="380" height="58" rx="10" fill="#0a1324" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.35" />
      <circle cx="-168" cy="1" r="5" fill="#00f3ff" filter="url(#glow-cyan-s4)" />
      <text x="-152" y="-3" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Wireless communication and</text>
      <text x="-152" y="16" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#00f3ff">power-transfer ambitions</text>
    </g>

    
    <g transform="translate(0, -38)">
      <rect x="-190" y="-28" width="380" height="58" rx="10" fill="#0a1324" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.35" />
      <circle cx="-168" cy="1" r="5" fill="#00ff88" filter="url(#glow-cyan-s4)" />
      <text x="-152" y="-3" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Wardenclyffe Tower</text>
      <text x="-152" y="16" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#00ff88">Work began in 1901</text>
    </g>

    
    <g transform="translate(0, 36)">
      <rect x="-190" y="-28" width="380" height="58" rx="10" fill="#0a1324" stroke="#ff9800" stroke-width="1" stroke-opacity="0.35" />
      <circle cx="-168" cy="1" r="5" fill="#ff9800" filter="url(#glow-amber-s4)" />
      <text x="-152" y="-3" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">The project was never</text>
      <text x="-152" y="16" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ffb74d">completed as planned</text>
    </g>

    
    <g transform="translate(0, 128)">
      <rect x="-190" y="-42" width="380" height="86" rx="12" fill="#1c080a" stroke="#ff5252" stroke-width="1.8" class="note-border" />
      <rect x="-174" y="-30" width="130" height="20" rx="5" fill="#330d11" stroke="#ff5252" stroke-width="1" />
      <text x="-109" y="-16" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold" fill="#ff5252">HISTORICAL FACT</text>
      
      <text x="-174" y="12" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">
        Tesla did <tspan fill="#ff5252">NOT</tspan> invent
      </text>
      <text x="-174" y="31" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="800" fill="#00f3ff">
        Quantum Teleportation
      </text>
    </g>
  </g>

  
  <g transform="translate(500, 595)">
    <rect x="-430" y="-20" width="860" height="38" rx="8" fill="#050a14" stroke="#1a2d48" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11.5" font-weight="bold" fill="#7d9ec0">
      <tspan fill="#00f3ff">TESLA (1901):</tspan> Classical Wireless Energy  →  <tspan fill="#00ff88">QUANTUM TELEPORTATION (1993):</tspan> <tspan fill="#ffffff">Entanglement &amp; Quantum Information</tspan>
    </text>
  </g>
</svg>