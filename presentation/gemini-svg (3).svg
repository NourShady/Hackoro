<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Dark Sci-Fi Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    <!-- Pad Base Glows -->
    <radialGradient id="pad-alice-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pad-bob-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Idle Ambient Animations for a Alive/Background feel */

    /* Pulsing Base Glows */
    @keyframes pulseA {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }
    @keyframes pulseB {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    /* Idle connection trail effect */
    @keyframes conduitIdle {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    /* Ambient tiny particles rising inside empty chambers */
    @keyframes floatingDust {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-160px) scale(1.2); opacity: 0; }
    }

    .pulse-alice { animation: pulseA 4s ease-in-out infinite; }
    .pulse-bob { animation: pulseB 4.5s ease-in-out infinite; }
    .dust-particles circle { animation: floatingDust 6s linear infinite; }
  </style>

  <!-- Deep Space Grid Background -->
  <rect width="1000" height="650" fill="url(#bg-grad)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  <!-- Title &amp; Pipeline Header -->
  <text x="500" y="45" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#ffffff" opacity="0.8" filter="url(#glow-cyan)">HUMAN QUANTUM TELEPORTATION CHAMBER</text>
  
  <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" opacity="0.4">
    <text x="200" y="85" text-anchor="middle" fill="#00f3ff">1. SCAN &amp;DEMATERIALIZE</text>
    <text x="500" y="85" text-anchor="middle" fill="#00f3ff">2. TRANSMIT QUANTUM STATE</text>
    <text x="800" y="85" text-anchor="middle" fill="#00ff88">3. RECONSTRUCT AT DESTINATION</text>
  </g>

  <!-- ================= TRANSMISSION CHANNEL (IDLE BACKGROUND) ================= -->
  <!-- Cable Conduit Base -->
  <path d="M 200,250 C 350,150 650,150 800,250" fill="none" stroke="#0a192f" stroke-width="12" />
  <path d="M 200,250 C 350,150 650,150 800,250" fill="none" stroke="#1e3a5f" stroke-width="4" />
  
  <!-- Subtle idle fiber conduit track -->
  <path d="M 200,250 C 350,150 650,150 800,250" fill="none" stroke="#00f3ff" stroke-width="2" stroke-dasharray="12 45" opacity="0.4" style="animation: conduitIdle 15s linear infinite;" />

  <!-- ================= TRANSMITTER POD (ALICE - LEFT) ================= -->
  <g transform="translate(200, 340)">
    <!-- Base Platform Glow -->
    <ellipse cx="0" cy="110" rx="90" ry="30" fill="url(#pad-alice-glow)" class="pulse-alice" />
    
    <!-- Chamber Platform Floor -->
    <ellipse cx="0" cy="110" rx="80" ry="25" fill="#091322" stroke="#00f3ff" stroke-width="2" />
    <ellipse cx="0" cy="110" rx="60" ry="18" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="6 4" opacity="0.4" />

    <!-- Ceiling Emitter Pad -->
    <ellipse cx="0" cy="-110" rx="70" ry="20" fill="#091322" stroke="#00f3ff" stroke-width="2" />
    
    <!-- Glass Chamber Columns -->
    <path d="M -70,-110 L -70,110 M 70,-110 L 70,110" stroke="#00f3ff" stroke-width="1.5" opacity="0.2" />
    <rect x="-70" y="-110" width="140" height="220" fill="#00f3ff" opacity="0.02" rx="10" />

    <!-- Ambient particles floating internally -->
    <g class="dust-particles">
      <circle cx="-35" cy="80" r="1.5" fill="#00f3ff" style="animation-delay: 1s;" />
      <circle cx="20" cy="60" r="2" fill="#00f3ff" style="animation-delay: 3s;" />
      <circle cx="-15" cy="90" r="1" fill="#00f3ff" style="animation-delay: 0s;" />
      <circle cx="45" cy="70" r="1.5" fill="#00f3ff" style="animation-delay: 4.5s;" />
    </g>

    <!-- Station Label -->
    <rect x="-60" y="145" width="120" height="22" rx="4" fill="#061224" stroke="#00f3ff" stroke-width="1" opacity="0.5" />
    <text x="0" y="160" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="700" fill="#00f3ff" opacity="0.6">TRANSMITTER</text>
  </g>

  <!-- ================= RECEIVER POD (BOB - RIGHT) ================= -->
  <g transform="translate(800, 340)">
    <!-- Base Platform Glow -->
    <ellipse cx="0" cy="110" rx="90" ry="30" fill="url(#pad-bob-glow)" class="pulse-bob" />
    
    <!-- Chamber Platform Floor -->
    <ellipse cx="0" cy="110" rx="80" ry="25" fill="#041c14" stroke="#00ff88" stroke-width="2" />
    <ellipse cx="0" cy="110" rx="60" ry="18" fill="none" stroke="#00ff88" stroke-width="1" stroke-dasharray="6 4" opacity="0.4" />

    <!-- Ceiling Emitter Pad -->
    <ellipse cx="0" cy="-110" rx="70" ry="20" fill="#041c14" stroke="#00ff88" stroke-width="2" />
    
    <!-- Glass Chamber Columns -->
    <path d="M -70,-110 L -70,110 M 70,-110 L 70,110" stroke="#00ff88" stroke-width="1.5" opacity="0.2" />
    <rect x="-70" y="-110" width="140" height="220" fill="#00ff88" opacity="0.02" rx="10" />

    <!-- Ambient particles floating internally -->
    <g class="dust-particles">
      <circle cx="-25" cy="70" r="2" fill="#00ff88" style="animation-delay: 2s;" />
      <circle cx="30" cy="90" r="1" fill="#00ff88" style="animation-delay: 0.5s;" />
      <circle cx="-40" cy="50" r="1.5" fill="#00ff88" style="animation-delay: 3.5s;" />
      <circle cx="15" cy="80" r="1.2" fill="#00ff88" style="animation-delay: 1.5s;" />
    </g>

    <!-- Station Label -->
    <rect x="-60" y="145" width="120" height="22" rx="4" fill="#021a10" stroke="#00ff88" stroke-width="1" opacity="0.5" />
    <text x="0" y="160" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="700" fill="#00ff88" opacity="0.6">RECEIVER</text>
  </g>

  <!-- ================= SCI-FI TELEPORTATION INFO PANEL ================= -->
  <g transform="translate(500, 580)" opacity="0.7">
    <rect x="-320" y="-22" width="640" height="40" rx="8" fill="#050a14" stroke="#1a2d48" stroke-width="1.5" />
    <text x="0" y="-3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="12" fill="#7d9ec0">
      SYSTEM STATUS: <tspan fill="#00f3ff">AWAITING TARGET</tspan> | BIO-MATRIX: <tspan fill="#4a6585">STANDBY</tspan>
    </text>
    <text x="0" y="13" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" fill="#4a6585">
      (No data packets in transmission - Quantum channels calibrated &amp;standby)
    </text>
  </g>
</svg>