<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bg-grad-s3" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    
    <radialGradient id="fiction-glow-s3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="reality-glow-s3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    
    <filter id="glow-cyan-s3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-orange-s3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense-s3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    
    <g id="mini-human-s3">
      <circle cx="0" cy="-24" r="6" />
      <path d="M -9,-16 C -9,-16 -5,-17 0,-17 C 5,-17 9,-16 9,-16 L 7,-2 C 7,-2 6,0 5,6 L 6,16 L 3,16 L 2,4 L -2,4 L -3,16 L -6,16 L -5,6 C -6,0 -7,-2 -7,-2 Z" />
    </g>
  </defs>

  <style>
    /* Sci-Fi Physical Body Fade Out / Reappear Animation */
    @keyframes bodyVanish {
      0%, 15% { opacity: 1; transform: scale(1); }
      35%, 75% { opacity: 0.1; transform: scale(0.85); }
      90%, 100% { opacity: 1; transform: scale(1); }
    }
    @keyframes bodyAppear {
      0%, 25% { opacity: 0.1; transform: scale(0.85); }
      45%, 85% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.1; transform: scale(0.85); }
    }
    @keyframes matterBeam {
      0% { stroke-dashoffset: 180; opacity: 0.3; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -180; opacity: 0.3; }
    }

    /* Quantum State Transfer (Particles Stay Put, State Moves) */
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes stateWaveFlow {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes psiTransfer {
      0% { transform: translate(-105px, -18px) scale(0.7); opacity: 0; }
      15% { opacity: 1; transform: translate(-105px, -18px) scale(1); }
      50% { transform: translate(0px, -42px) scale(1.15); opacity: 1; }
      85% { opacity: 1; transform: translate(105px, -18px) scale(1); }
      100% { transform: translate(105px, -18px) scale(0.7); opacity: 0; }
    }
    @keyframes particleAnchorPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .orbit-cw-s3 { transform-origin: center; animation: spinClockwise 9s linear infinite; }
    .orbit-ccw-s3 { transform-origin: center; animation: spinCounter 12s linear infinite; }
    .human-left-s3 { animation: bodyVanish 5s ease-in-out infinite; }
    .human-right-s3 { animation: bodyAppear 5s ease-in-out infinite; }
    .anchor-pulse-s3 { animation: particleAnchorPulse 2.5s ease-in-out infinite; }
  </style>

  
  <rect width="1000" height="650" fill="url(#bg-grad-s3)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  
  
  <g transform="translate(500, 32)">
    <rect x="-125" y="-13" width="250" height="24" rx="12" fill="#061224" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" letter-spacing="2" fill="#00f3ff">SLIDE 03   |   SPEAKER 02</text>
  </g>

  
  <text x="500" y="76" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="30" font-weight="900" letter-spacing="5" fill="#ffffff" filter="url(#glow-cyan-s3)">FICTION VS. REALITY</text>

  
  <text x="500" y="102" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#7d9ec0">PHYSICAL MATTER TRANSPORT VS. QUANTUM STATE TRANSFER</text>

  
  <line x1="500" y1="135" x2="500" y2="545" stroke="#1e2d42" stroke-width="2" stroke-dasharray="6 6" />
  <g transform="translate(500, 340)">
    <circle cx="0" cy="0" r="24" fill="#04060b" stroke="#1e2d42" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="800" fill="#7d9ec0">VS</text>
  </g>

  
  <g transform="translate(245, 340)">
    <circle cx="0" cy="0" r="155" fill="url(#fiction-glow-s3)" />
    <rect x="-200" y="-195" width="400" height="390" rx="16" fill="#0c0804" stroke="#ff9800" stroke-width="2" stroke-opacity="0.85" />

    
    <rect x="-115" y="-175" width="230" height="28" rx="14" fill="#1f1103" stroke="#ff9800" stroke-width="1.2" />
    <text x="0" y="-157" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#ff9800">SCIENCE FICTION</text>

    
    <g transform="translate(0, -35)">
      
      <rect x="-135" y="-42" width="60" height="84" rx="8" fill="#140c03" stroke="#ff9800" stroke-width="1.5" />
      <g transform="translate(-105, 4)" class="human-left-s3">
        <use href="#mini-human-s3" fill="#ff9800" filter="url(#glow-orange-s3)" />
      </g>
      <text x="-105" y="58" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold" fill="#ff9800">ORIGIN</text>

      
      <rect x="75" y="-42" width="60" height="84" rx="8" fill="#140c03" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="4 3" />
      <g transform="translate(105, 4)" class="human-right-s3">
        <use href="#mini-human-s3" fill="#ffb74d" filter="url(#glow-orange-s3)" />
      </g>
      <text x="105" y="58" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold" fill="#ffb74d">TARGET</text>

      
      <line x1="-68" y1="0" x2="68" y2="0" stroke="#ff9800" stroke-width="3" stroke-dasharray="10 6" filter="url(#glow-orange-s3)" style="animation: matterBeam 2s linear infinite;" />
      <polygon points="72,0 60,-6 60,6" fill="#ff9800" />
      <text x="0" y="-12" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffb74d">MATTER MOVES</text>
    </g>

    
    <rect x="-175" y="55" width="350" height="115" rx="10" fill="#140c04" stroke="#ff9800" stroke-width="1" stroke-opacity="0.4" />
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" text-anchor="start">
      <circle cx="-152" cy="88" r="4" fill="#ff9800" />
      <text x="-140" y="92" font-size="13" font-weight="700" fill="#ffffff">Moving a person or a physical object</text>

      <circle cx="-152" cy="126" r="4" fill="#ff9800" />
      <text x="-140" y="130" font-size="13" font-weight="700" fill="#ffb74d">The whole body appears in another place</text>
    </g>
  </g>

  
  <g transform="translate(755, 340)">
    <circle cx="0" cy="0" r="155" fill="url(#reality-glow-s3)" />
    <rect x="-200" y="-195" width="400" height="390" rx="16" fill="#040d14" stroke="#00f3ff" stroke-width="2" stroke-opacity="0.85" />

    
    <rect x="-130" y="-175" width="260" height="28" rx="14" fill="#031926" stroke="#00f3ff" stroke-width="1.2" />
    <text x="0" y="-157" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#00f3ff">QUANTUM TELEPORTATION</text>

    
    <g transform="translate(0, -35)">
      
      <g transform="translate(-105, 0)">
        <circle cx="0" cy="0" r="32" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-dasharray="5 3" class="orbit-cw-s3" />
        <circle cx="0" cy="0" r="16" fill="#041e2b" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan-s3)" class="anchor-pulse-s3" />
        <circle cx="0" cy="0" r="5" fill="#00f3ff" />
        <text x="0" y="58" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold" fill="#00f3ff">PARTICLE A</text>
      </g>

      
      <g transform="translate(105, 0)">
        <circle cx="0" cy="0" r="32" fill="none" stroke="#00ff88" stroke-width="1.2" stroke-dasharray="5 3" class="orbit-ccw-s3" />
        <circle cx="0" cy="0" r="16" fill="#042418" stroke="#00ff88" stroke-width="2" filter="url(#glow-cyan-s3)" class="anchor-pulse-s3" />
        <circle cx="0" cy="0" r="5" fill="#00ff88" />
        <text x="0" y="58" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold" fill="#00ff88">PARTICLE B</text>
      </g>

      
      <path d="M -70,0 C -30,-30 30,-30 70,0" fill="none" stroke="#00f3ff" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#glow-cyan-s3)" style="animation: stateWaveFlow 3s linear infinite;" />
      <polygon points="73,2 61,-5 63,7" fill="#00ff88" />
      <text x="0" y="22" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" font-weight="700" fill="#00ff88">STATE |Ψ⟩ TRANSFERS</text>

      
      <g style="animation: psiTransfer 4s ease-in-out infinite;">
        <rect x="-16" y="-12" width="32" height="22" rx="6" fill="#051a24" stroke="#ffffff" stroke-width="1.2" filter="url(#glow-intense-s3)" />
        <text x="0" y="4" text-anchor="middle" font-family="&#39;Georgia&#39;, serif" font-style="italic" font-size="13" font-weight="bold" fill="#ffffff">|Ψ⟩</text>
      </g>
    </g>

    
    <rect x="-175" y="55" width="350" height="115" rx="10" fill="#04121c" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.4" />
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" text-anchor="start">
      <circle cx="-152" cy="88" r="4" fill="#00f3ff" />
      <text x="-140" y="92" font-size="13" font-weight="700" fill="#ffffff">Transfers a quantum state</text>

      <circle cx="-152" cy="126" r="4" fill="#00ff88" />
      <text x="-140" y="130" font-size="13" font-weight="700" fill="#00ff88">The particle itself does not travel</text>
    </g>
  </g>

  
  <g transform="translate(500, 595)">
    <rect x="-410" y="-20" width="820" height="38" rx="8" fill="#050a14" stroke="#1a2d48" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="12" font-weight="bold" fill="#7d9ec0">
      <tspan fill="#ff9800">FICTION:</tspan> Relocates Physical Atoms  |  <tspan fill="#00f3ff">QUANTUM REALITY:</tspan> <tspan fill="#00ff88">Recreates Exact Information State</tspan>
    </text>
  </g>
</svg>