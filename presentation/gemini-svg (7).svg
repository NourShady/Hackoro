<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bg-grad-s8" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    
    <radialGradient id="alice-glow-s8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="bob-glow-s8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e040fb" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#e040fb" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="epr-glow-s8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="psi-sphere-s8" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#ffeb3b" />
      <stop offset="100%" stop-color="#ff9800" />
    </radialGradient>

    
    <linearGradient id="entangle-link-s8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#e040fb" />
    </linearGradient>

    
    <filter id="glow-cyan-s8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple-s8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-amber-s8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense-s8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Setup Sequence Animations (8s loop) */
    @keyframes spinClockwiseS8 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounterS8 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes unknownPsiFloatS8 {
      0%, 100% { transform: translate(-255px, -38px) scale(1); }
      50% { transform: translate(-255px, -46px) scale(1.08); }
    }
    @keyframes eprPulseS8 {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      25% { transform: scale(1.22); opacity: 1; }
      50% { transform: scale(1); opacity: 0.9; }
    }
    @keyframes qubitDistributeAS8 {
      0% { transform: translate(0px, 52px) scale(0.5); opacity: 0; }
      15% { opacity: 1; scale: 1; }
      42%, 90% { transform: translate(-185px, -6px) scale(1); opacity: 1; }
      100% { transform: translate(-185px, -6px) scale(0.5); opacity: 0; }
    }
    @keyframes qubitDistributeBS8 {
      0% { transform: translate(0px, 52px) scale(0.5); opacity: 0; }
      15% { opacity: 1; scale: 1; }
      42%, 90% { transform: translate(215px, -6px) scale(1); opacity: 1; }
      100% { transform: translate(215px, -6px) scale(0.5); opacity: 0; }
    }
    @keyframes entangleWaveFlowS8 {
      0% { stroke-dashoffset: 380; }
      100% { stroke-dashoffset: 0; }
    }

    .orbit-cw-s8 { transform-origin: center; animation: spinClockwiseS8 9s linear infinite; }
    .orbit-ccw-s8 { transform-origin: center; animation: spinCounterS8 12s linear infinite; }
    .psi-float-s8 { animation: unknownPsiFloatS8 3.2s ease-in-out infinite; }
    .epr-core-s8 { transform-origin: center; animation: eprPulseS8 4s ease-in-out infinite; }
    .dist-qubit-a-s8 { animation: qubitDistributeAS8 7s ease-in-out infinite; }
    .dist-qubit-b-s8 { animation: qubitDistributeBS8 7s ease-in-out infinite; }
  </style>

  
  <rect width="1000" height="650" fill="url(#bg-grad-s8)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  
  
  <g transform="translate(500, 32)">
    <rect x="-125" y="-13" width="250" height="24" rx="12" fill="#061224" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" letter-spacing="2" fill="#00f3ff">SLIDE 08   |   SPEAKER 07</text>
  </g>

  
  <text x="500" y="75" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="27" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#glow-cyan-s8)">HOW QUANTUM TELEPORTATION WORKS</text>

  
  <g transform="translate(500, 105)">
    <rect x="-135" y="-13" width="270" height="24" rx="12" fill="#041914" stroke="#00ff88" stroke-width="1.2" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" fill="#00ff88">MEET ALICE AND BOB</text>
  </g>

  
  <g transform="translate(500, 240)">
    
    <rect x="-430" y="-108" width="860" height="216" rx="16" fill="#050b16" stroke="#1e2d42" stroke-width="1.6" />

    
    <path d="M 0,52 L -185,-6" fill="none" stroke="#00f3ff" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.45" />
    <path d="M 0,52 L 215,-6" fill="none" stroke="#e040fb" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.45" />

    
    <path d="M -185,-6 C -80,-48 80,36 215,-6" fill="none" stroke="url(#entangle-link-s8)" stroke-width="2.2" stroke-dasharray="8 5" filter="url(#glow-cyan-s8)" style="animation: entangleWaveFlowS8 3.5s linear infinite;" />
    <rect x="-92" y="-34" width="184" height="20" rx="10" fill="#061220" stroke="#00ff88" stroke-width="1" />
    <text x="0" y="-21" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#00ff88">SHARED ENTANGLED PAIR</text>

    
    <g transform="translate(-235, -12)">
      <circle cx="0" cy="0" r="88" fill="url(#alice-glow-s8)" />
      <rect x="-145" y="-82" width="290" height="164" rx="14" fill="#04121f" stroke="#00f3ff" stroke-width="1.6" stroke-opacity="0.7" />
      
      
      <rect x="-75" y="-72" width="150" height="22" rx="11" fill="#062036" stroke="#00f3ff" stroke-width="1" />
      <text x="0" y="-57" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#00f3ff">ALICE (SENDER)</text>

      
      <circle cx="50" cy="6" r="24" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-dasharray="4 3" class="orbit-cw-s8" />
      <text x="50" y="44" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#00f3ff">QUBIT A</text>

      
      <text x="-48" y="44" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#ffeb3b">UNKNOWN |Ψ⟩</text>
    </g>

    
    <g class="psi-float-s8">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#ffeb3b" stroke-width="1.2" stroke-dasharray="4 3" class="orbit-ccw-s8" />
      <circle cx="0" cy="0" r="14" fill="url(#psi-sphere-s8)" filter="url(#glow-amber-s8)" />
      <text x="0" y="5" text-anchor="middle" font-family="&#39;Georgia&#39;, serif" font-style="italic" font-size="13" font-weight="bold" fill="#1a0c00">|Ψ⟩</text>
    </g>

    
    <g transform="translate(235, -12)">
      <circle cx="0" cy="0" r="88" fill="url(#bob-glow-s8)" />
      <rect x="-145" y="-82" width="290" height="164" rx="14" fill="#14061c" stroke="#e040fb" stroke-width="1.6" stroke-opacity="0.7" />
      
      
      <rect x="-75" y="-72" width="150" height="22" rx="11" fill="#270a36" stroke="#e040fb" stroke-width="1" />
      <text x="0" y="-57" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#e040fb">BOB (RECEIVER)</text>

      
      <circle cx="-20" cy="6" r="24" fill="none" stroke="#e040fb" stroke-width="1.2" stroke-dasharray="4 3" class="orbit-ccw-s8" />
      <text x="-20" y="44" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#e040fb">QUBIT B</text>

      
      <rect x="26" y="-12" width="98" height="36" rx="8" fill="#1e0829" stroke="#e040fb" stroke-width="1" stroke-opacity="0.5" />
      <text x="75" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9" font-weight="bold" fill="#f3a6ff">READY FOR</text>
      <text x="75" y="15" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9" font-weight="bold" fill="#ffffff">STATE |Ψ⟩</text>
    </g>

    
    <g transform="translate(0, 52)">
      <circle cx="0" cy="0" r="36" fill="url(#epr-glow-s8)" />
      <g class="epr-core-s8">
        <circle cx="0" cy="0" r="14" fill="#042418" stroke="#00ff88" stroke-width="2" filter="url(#glow-cyan-s8)" />
        <circle cx="0" cy="0" r="5" fill="#00ff88" />
      </g>
      <rect x="-95" y="19" width="190" height="20" rx="6" fill="#031a12" stroke="#00ff88" stroke-width="1" />
      <text x="0" y="32" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#00ff88">ENTANGLEMENT SOURCE</text>
    </g>

    
    <g class="dist-qubit-a-s8">
      <circle cx="0" cy="0" r="9" fill="#00f3ff" filter="url(#glow-intense-s8)" />
      <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9" font-weight="bold" fill="#000000">A</text>
    </g>
    <g class="dist-qubit-b-s8">
      <circle cx="0" cy="0" r="9" fill="#e040fb" filter="url(#glow-intense-s8)" />
      <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9" font-weight="bold" fill="#ffffff">B</text>
    </g>
  </g>

  
  <g transform="translate(500, 462)">
    
    <g transform="translate(-220, -48)">
      <rect x="-210" y="-32" width="420" height="64" rx="12" fill="#070e1c" stroke="#ffeb3b" stroke-width="1.4" stroke-opacity="0.65" />
      <rect x="-192" y="-15" width="68" height="30" rx="8" fill="#241c03" stroke="#ffeb3b" stroke-width="1.2" />
      <text x="-158" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#ffeb3b">STEP 1</text>
      <text x="-110" y="-4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Alice has an unknown quantum</text>
      <text x="-110" y="15" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffeb3b">state to transfer.</text>
    </g>

    
    <g transform="translate(220, -48)">
      <rect x="-210" y="-32" width="420" height="64" rx="12" fill="#070e1c" stroke="#00f3ff" stroke-width="1.4" stroke-opacity="0.65" />
      <rect x="-192" y="-15" width="68" height="30" rx="8" fill="#031d2b" stroke="#00f3ff" stroke-width="1.2" />
      <text x="-158" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#00f3ff">STEP 2</text>
      <text x="-110" y="-4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Alice and Bob share an</text>
      <text x="-110" y="15" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#00f3ff">entangled pair.</text>
    </g>

    
    <g transform="translate(-220, 32)">
      <rect x="-210" y="-32" width="420" height="64" rx="12" fill="#070e1c" stroke="#e040fb" stroke-width="1.4" stroke-opacity="0.65" />
      <rect x="-192" y="-15" width="68" height="30" rx="8" fill="#230730" stroke="#e040fb" stroke-width="1.2" />
      <text x="-158" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#e040fb">STEP 3</text>
      <text x="-110" y="-4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Alice holds one particle;</text>
      <text x="-110" y="15" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#f3a6ff">Bob holds the other.</text>
    </g>

    
    <g transform="translate(220, 32)">
      <rect x="-210" y="-32" width="420" height="64" rx="12" fill="#041914" stroke="#00ff88" stroke-width="1.6" />
      <rect x="-192" y="-15" width="68" height="30" rx="8" fill="#062b22" stroke="#00ff88" stroke-width="1.2" />
      <text x="-158" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10.5" font-weight="bold" fill="#00ff88">SETUP</text>
      <text x="-110" y="-4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Shared entanglement is prepared</text>
      <text x="-110" y="15" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="800" fill="#00ff88">before the protocol.</text>
    </g>
  </g>

  
  <g transform="translate(500, 595)">
    <rect x="-430" y="-20" width="860" height="38" rx="8" fill="#050a14" stroke="#1a2d48" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11.5" font-weight="bold" fill="#7d9ec0">
      <tspan fill="#ffeb3b">INPUT:</tspan> Unknown State |Ψ⟩ at Alice + <tspan fill="#00ff88">RESOURCE:</tspan> Pre-Shared Entangled Pair (<tspan fill="#00f3ff">Qubit A</tspan> &amp; <tspan fill="#e040fb">Qubit B</tspan>)
    </text>
  </g>
</svg>