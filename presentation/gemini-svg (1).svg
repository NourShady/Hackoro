<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bg-grad-s2" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    
    <radialGradient id="scifi-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="quantum-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="wormhole-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>

    
    <filter id="glow-cyan-s2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-orange-s2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense-s2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Animations */
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes distanceCollapse {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.4; }
      50% { stroke-dashoffset: 60; opacity: 1; }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes scifiFlash {
      0%, 40%, 60%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes stateTransfer {
      0% { transform: translate(740px, 340px) scale(0.6); opacity: 0; }
      20% { opacity: 1; scale: 1; }
      80% { opacity: 1; scale: 1; }
      100% { transform: translate(860px, 340px) scale(0.6); opacity: 0; }
    }

    .orbit-cw { transform-origin: center; animation: spinClockwise 10s linear infinite; }
    .orbit-ccw { transform-origin: center; animation: spinCounter 14s linear infinite; }
    .pulse-core { transform-origin: center; animation: pulseCore 3s ease-in-out infinite; }
  </style>

  
  <rect width="1000" height="650" fill="url(#bg-grad-s2)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  
  
  <g transform="translate(500, 32)">
    <rect x="-125" y="-13" width="250" height="24" rx="12" fill="#061224" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" letter-spacing="2" fill="#00f3ff">SLIDE 02   |   SPEAKER 01</text>
  </g>

  
  <text x="500" y="74" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="5" fill="#ffffff" filter="url(#glow-cyan-s2)">THE BIG QUESTION</text>

  
  <text x="500" y="101" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="2.5" fill="#00ff88">WHAT IF DISTANCE DISAPPEARED?</text>

  
  <text x="500" y="122" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11.5" font-weight="500" letter-spacing="0.8" fill="#7d9ec0">Could we move from one place to another instantly?</text>

  
  <line x1="500" y1="155" x2="500" y2="525" stroke="#1e2d42" stroke-width="2" stroke-dasharray="6 6" />
  
  
  <g transform="translate(500, 340)">
    <circle cx="0" cy="0" r="28" fill="#050a14" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan-s2)" />
    <text x="0" y="7" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff">?</text>
  </g>

  
  <g transform="translate(245, 340)">
    <circle cx="0" cy="0" r="145" fill="url(#scifi-glow)" />
    <rect x="-185" y="-165" width="370" height="330" rx="16" fill="#0b0804" stroke="#ff9800" stroke-width="1.8" stroke-opacity="0.85" />

    
    <rect x="-110" y="-145" width="220" height="26" rx="13" fill="#1a0f02" stroke="#ff9800" stroke-width="1.2" />
    <text x="0" y="-128" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#ff9800">HOLLYWOOD SCI-FI</text>

    
    <g transform="translate(0, -10)">
      
      <circle cx="-100" cy="0" r="26" fill="#1c1104" stroke="#ff9800" stroke-width="2" />
      <text x="-100" y="5" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="14" font-weight="bold" fill="#ff9800">A</text>

      <circle cx="100" cy="0" r="26" fill="#1c1104" stroke="#ff9800" stroke-width="2" stroke-dasharray="4 3" />
      <text x="100" y="5" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="14" font-weight="bold" fill="#ff9800">B</text>

      
      <line x1="-68" y1="0" x2="68" y2="0" stroke="#ff9800" stroke-width="2.5" stroke-dasharray="6 6" style="animation: distanceCollapse 3s linear infinite;" />

      
      <g style="animation: scifiFlash 4s infinite;">
        <circle cx="0" cy="0" r="22" fill="#240808" stroke="#ff5252" stroke-width="2.5" filter="url(#glow-orange-s2)" />
        <line x1="-10" y1="-10" x2="10" y2="10" stroke="#ff5252" stroke-width="3" stroke-linecap="round" />
        <line x1="10" y1="-10" x2="-10" y2="10" stroke="#ff5252" stroke-width="3" stroke-linecap="round" />
      </g>
    </g>

    
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" text-anchor="middle">
      <text x="0" y="65" font-size="14" font-weight="800" fill="#ffb74d">Physical Matter &amp; Humans</text>
      <text x="0" y="90" font-size="11.5" fill="#d9a779">• Beaming physical bodies across space</text>
      <text x="0" y="112" font-size="11.5" fill="#d9a779">• Faster-than-light instant travel</text>
      <text x="0" y="138" font-size="11" font-weight="700" fill="#ff5252" letter-spacing="1">[ NOT PHYSICALLY POSSIBLE ]</text>
    </g>
  </g>

  
  <g transform="translate(755, 340)">
    <circle cx="0" cy="0" r="145" fill="url(#quantum-glow)" />
    <rect x="-185" y="-165" width="370" height="330" rx="16" fill="#040d14" stroke="#00f3ff" stroke-width="1.8" stroke-opacity="0.85" />

    
    <rect x="-110" y="-145" width="220" height="26" rx="13" fill="#031824" stroke="#00f3ff" stroke-width="1.2" />
    <text x="0" y="-128" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#00f3ff">QUANTUM REALITY</text>

    
    <g transform="translate(0, -10)">
      
      <circle cx="-100" cy="0" r="30" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-dasharray="5 3" class="orbit-cw" />
      <circle cx="-100" cy="0" r="18" fill="#041e2b" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan-s2)" />
      <text x="-100" y="5" text-anchor="middle" font-family="&#39;Georgia&#39;, serif" font-style="italic" font-size="14" font-weight="bold" fill="#ffffff">|Ψ⟩</text>

      
      <circle cx="100" cy="0" r="30" fill="none" stroke="#00ff88" stroke-width="1.2" stroke-dasharray="5 3" class="orbit-ccw" />
      <circle cx="100" cy="0" r="18" fill="#042418" stroke="#00ff88" stroke-width="2" filter="url(#glow-cyan-s2)" />
      <text x="100" y="5" text-anchor="middle" font-family="&#39;Georgia&#39;, serif" font-style="italic" font-size="14" font-weight="bold" fill="#00ff88">|Ψ⟩</text>

      
      <path d="M -70,0 C -30,-22 30,22 70,0" fill="none" stroke="#00f3ff" stroke-width="2.5" filter="url(#glow-cyan-s2)" />
      <path d="M -70,0 C -30,22 30,-22 70,0" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.7" />
    </g>

    
    <g style="animation: stateTransfer 3.5s ease-in-out infinite;">
      <circle cx="-800" cy="-350" r="5" fill="#ffffff" filter="url(#glow-intense-s2)" />
    </g>

    
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" text-anchor="middle">
      <text x="0" y="65" font-size="14" font-weight="800" fill="#00f3ff">Quantum Information &amp; States</text>
      <text x="0" y="90" font-size="11.5" fill="#9deeff">• Teleports exact qubit states, not atoms</text>
      <text x="0" y="112" font-size="11.5" fill="#9deeff">• Powered by Quantum Entanglement</text>
      <text x="0" y="138" font-size="11" font-weight="700" fill="#00ff88" letter-spacing="1">[ PROVEN IN REAL LABS ]</text>
    </g>
  </g>

  
  <g transform="translate(500, 588)">
    <rect x="-410" y="-22" width="820" height="42" rx="8" fill="#050a14" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.7" />
    <text x="0" y="4" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14.5" font-weight="800" letter-spacing="1" fill="#ffffff">
      Quantum Teleportation is <tspan fill="#00ff88">REAL</tspan> — <tspan fill="#00f3ff">but not like in the movies.</tspan>
    </text>
  </g>
</svg>