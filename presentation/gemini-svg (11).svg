<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bg-grad-s12" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    
    <radialGradient id="ml-glow-s12" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="limit-glow-s12" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e040fb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e040fb" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="gauge-grad-s12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#ff9800" />
    </linearGradient>

    
    <filter id="glow-cyan-s12" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple-s12" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red-s12" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense-s12" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Animations */
    @keyframes nnSignalPulseS12 {
      0% { stroke-dashoffset: 180; opacity: 0.4; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.4; }
    }
    @keyframes gaugeBalanceNeedleS12 {
      0%, 100% { transform: rotate(-28deg); }
      50% { transform: rotate(28deg); }
    }
    @keyframes limitAlertPulseS12 {
      0%, 100% { stroke-opacity: 0.7; }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 10px #ff5252); }
    }
    @keyframes spinClockwiseS12 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes fiberWaveS12 {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }

    .nn-synapse-s12 { stroke-dasharray: 8 6; animation: nnSignalPulseS12 3s linear infinite; }
    .gauge-needle-s12 { transform-origin: 0px 28px; animation: gaugeBalanceNeedleS12 4.5s ease-in-out infinite; }
    .limit-box-s12 { animation: limitAlertPulseS12 3s ease-in-out infinite; }
    .orbit-cw-s12 { transform-origin: center; animation: spinClockwiseS12 10s linear infinite; }
    .fiber-stream-s12 { stroke-dasharray: 10 6; animation: fiberWaveS12 2.5s linear infinite; }
  </style>

  
  <rect width="1000" height="650" fill="url(#bg-grad-s12)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  
  
  <g transform="translate(500, 32)">
    <rect x="-125" y="-13" width="250" height="24" rx="12" fill="#061224" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" letter-spacing="2" fill="#00f3ff">SLIDE 12   |   SPEAKER 09</text>
  </g>

  
  <text x="500" y="75" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="27" font-weight="900" letter-spacing="3.5" fill="#ffffff" filter="url(#glow-cyan-s12)">
    WHEN <tspan fill="#00f3ff">AI</tspan> MEETS <tspan fill="#00f3ff">QUANTUM TELEPORTATION</tspan>
