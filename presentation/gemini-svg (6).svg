<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bg-grad-s7" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    
    <radialGradient id="qubit-a-glow-s7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="qubit-b-glow-s7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e040fb" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e040fb" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="entangle-beam-s7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e040fb" />
    </linearGradient>

    
    <filter id="glow-cyan-s7" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple-s7" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense-s7" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Synchronized Anti-Parallel Spin Vectors */
    @keyframes spinSyncAS7 {
      0%, 100% { transform: rotate(-35deg); }
      30% { transform: rotate(45deg); }
      55%, 85% { transform: rotate(0deg); }
    }
    @keyframes spinSyncBS7 {
      0%, 100% { transform: rotate(145deg); }
      30% { transform: rotate(225deg); }
      55%, 85% { transform: rotate(180deg); }
    }
    @keyframes waveFlowS7 {
      0% { stroke-dashoffset: 360; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbitClockwiseS7 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbitCounterS7 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes correlationPulseS7 {
      0%, 50%, 90%, 100% { opacity: 0.7; transform: scale(1); }
      65% { opacity: 1; transform: scale(1.06); }
    }

    .orbit-cw-s7 { transform-origin: center; animation: orbitClockwiseS7 9s linear infinite; }
    .orbit-ccw-s7 { transform-origin: center; animation: orbitCounterS7 12s linear infinite; }
    .spin-vec-a-s7 { transform-origin: 0px 0px; animation: spinSyncAS7 6s ease-in-out infinite; }
    .spin-vec-b-s7 { transform-origin: 0px 0px; animation: spinSyncBS7 6s ease-in-out infinite; }
    .bell-badge-s7 { transform-origin: center; animation: correlationPulseS7 6s ease-in-out infinite; }
  </style>

  
  <rect width="1000" height="650" fill="url(#bg-grad-s7)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  
  
  <g transform="translate(500, 32)">
    <rect x="-125" y="-13" width="250" height="24" rx="12" fill="#061224" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" letter-spacing="2" fill="#00f3ff">SLIDE 07   |   SPEAKER 06</text>
  </g>

  
  <text x="500" y="76" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="30" font-weight="900" letter-spacing="5" fill="#ffffff" filter="url(#glow-cyan-s7)">QUANTUM ENTANGLEMENT</text>

  
  <text x="500" y="102" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#7d9ec0">SHARED QUANTUM STATES &amp; NON-LOCAL CORRELATIONS</text>

  
  <g transform="translate(500, 232)">
    
    <rect x="-430" y="-102" width="860" height="204" rx="16" fill="#050b16" stroke="#1e2d42" stroke-width="1.6" />

    
    <line x1="-220" y1="74" x2="220" y2="74" stroke="#7d9ec0" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
    <polygon points="-225,74 -216,70 -216,78" fill="#7d9ec0" opacity="0.6" />
    <polygon points="225,74 216,70 216,78" fill="#7d9ec0" opacity="0.6" />
    <rect x="-125" y="63" width="250" height="20" rx="6" fill="#071120" stroke="#1e2d42" stroke-width="1" />
    <text x="0" y="76" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold" fill="#7d9ec0">CORRELATIONS PERSIST ACROSS ANY DISTANCE</text>

    
    <path d="M -250,-6 C -160,-52 -90,40 0,-6 C 90,-52 160,40 250,-6" fill="none" stroke="url(#entangle-beam-s7)" stroke-width="2.5" stroke-dasharray="10 6" filter="url(#glow-cyan-s7)" style="animation: waveFlowS7 3.5s linear infinite;" />
    <path d="M -250,-6 C -160,40 -90,-52 0,-6 C 90,40 160,-52 250,-6" fill="none" stroke="url(#entangle-beam-s7)" stroke-width="2.5" stroke-dasharray="10 6" filter="url(#glow-purple-s7)" style="animation: waveFlowS7 3.5s linear infinite reverse;" />

    
    <g transform="translate(0, -6)" class="bell-badge-s7">
      <rect x="-102" y="-19" width="204" height="38" rx="19" fill="#060f1e" stroke="url(#entangle-beam-s7)" stroke-width="1.8" />
      <text x="0" y="5" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="12" font-weight="bold" fill="#ffffff">|Ψ⫀⟩ = (|01⟩ + |10⟩)/√2</text>
    </g>

    
    <g transform="translate(-285, -6)">
      <circle cx="0" cy="0" r="82" fill="url(#qubit-a-glow-s7)" />
      <ellipse cx="0" cy="0" rx="64" ry="22" fill="none" stroke="#00f3ff" stroke-width="1.4" stroke-dasharray="6 4" class="orbit-cw-s7" opacity="0.7" />
      
      <g class="spin-vec-a-s7">
        <line x1="0" y1="28" x2="0" y2="-46" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan-s7)" />
        <polygon points="0,-54 -6,-40 6,-40" fill="#00f3ff" filter="url(#glow-intense-s7)" />
      </g>
      <circle cx="0" cy="0" r="20" fill="#041c29" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan-s7)" />
      <text x="0" y="6" text-anchor="middle" font-family="&#39;Georgia&#39;, serif" font-style="italic" font-size="16" font-weight="bold" fill="#ffffff">A</text>
      <text x="0" y="76" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10.5" font-weight="bold" fill="#00f3ff">PARTICLE A</text>
    </g>

    
    <g transform="translate(285, -6)">
      <circle cx="0" cy="0" r="82" fill="url(#qubit-b-glow-s7)" />
      <ellipse cx="0" cy="0" rx="64" ry="22" fill="none" stroke="#e040fb" stroke-width="1.4" stroke-dasharray="8 5" class="orbit-ccw-s7" opacity="0.7" />
      
      <g class="spin-vec-b-s7">
        <line x1="0" y1="28" x2="0" y2="-46" stroke="#e040fb" stroke-width="3" stroke-linecap="round" filter="url(#glow-purple-s7)" />
        <polygon points="0,-54 -6,-40 6,-40" fill="#e040fb" filter="url(#glow-intense-s7)" />
      </g>
      <circle cx="0" cy="0" r="20" fill="#1d0524" stroke="#e040fb" stroke-width="2" filter="url(#glow-purple-s7)" />
      <text x="0" y="6" text-anchor="middle" font-family="&#39;Georgia&#39;, serif" font-style="italic" font-size="16" font-weight="bold" fill="#ffffff">B</text>
      <text x="0" y="76" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10.5" font-weight="bold" fill="#e040fb">PARTICLE B</text>
    </g>
  </g>

  
  
  <g transform="translate(280, 456)">
    
    <g transform="translate(0, -72)">
      <rect x="-210" y="-23" width="420" height="46" rx="10" fill="#070e1c" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.45" />
      <circle cx="-188" cy="0" r="4.5" fill="#00f3ff" filter="url(#glow-cyan-s7)" />
      <text x="-172" y="4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Two particles share a joint quantum state</text>
    </g>

    
    <g transform="translate(0, -16)">
      <rect x="-210" y="-23" width="420" height="46" rx="10" fill="#070e1c" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.45" />
      <circle cx="-188" cy="0" r="4.5" fill="#e040fb" filter="url(#glow-purple-s7)" />
      <text x="-172" y="4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Measurements can show strong quantum correlations</text>
    </g>

    
    <g transform="translate(0, 40)">
      <rect x="-210" y="-23" width="420" height="46" rx="10" fill="#070e1c" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.45" />
      <circle cx="-188" cy="0" r="4.5" fill="#00f3ff" filter="url(#glow-cyan-s7)" />
      <text x="-172" y="4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#9deeff">Correlations can remain when particles are far apart</text>
    </g>
  </g>

  
  <g transform="translate(720, 456)">
    
    <g transform="translate(0, -56)">
      <rect x="-210" y="-38" width="420" height="76" rx="12" fill="#18080b" stroke="#ff5252" stroke-width="1.6" />
      <rect x="-192" y="-26" width="136" height="18" rx="4" fill="#2e0d12" stroke="#ff5252" stroke-width="0.9" />
      <text x="-124" y="-14" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#ff5252">RELATIVITY LIMIT</text>
      <text x="-192" y="10" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Entanglement alone cannot send</text>
      <text x="-192" y="27" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="800" fill="#ff8a80">messages faster than light</text>
    </g>

    
    <g transform="translate(0, 32)">
      <rect x="-210" y="-34" width="420" height="68" rx="12" fill="#041914" stroke="#00ff88" stroke-width="1.6" />
      <rect x="-192" y="-23" width="146" height="18" rx="4" fill="#062920" stroke="#00ff88" stroke-width="0.9" />
      <text x="-119" y="-11" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#00ff88">CORE INFRASTRUCTURE</text>
      <text x="-192" y="13" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">
        A key resource for <tspan fill="#00ff88">Quantum Teleportation</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(500, 595)">
    <rect x="-430" y="-20" width="860" height="38" rx="8" fill="#050a14" stroke="#1a2d48" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11.5" font-weight="bold" fill="#7d9ec0">
      <tspan fill="#00f3ff">ENTANGLEMENT</tspan> links quantum states across space + <tspan fill="#ff9800">CLASSICAL CHANNEL</tspan> → <tspan fill="#00ff88">Enables Quantum Teleportation</tspan>
    </text>
  </g>
</svg>