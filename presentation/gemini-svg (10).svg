<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#080c17" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000204" />
    </radialGradient>

    <!-- Pillar Glows -->
    <radialGradient id="app-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="chal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5252" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff5252" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="fut-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Animations */
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes dataPulse {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes particleFlowLeft {
      0% { transform: translate(210px, 310px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(500px, 310px); opacity: 0; }
    }
    @keyframes particleFlowRight {
      0% { transform: translate(500px, 310px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(790px, 310px); opacity: 0; }
    }

    .orbit-cw { transform-origin: center; animation: spinClockwise 10s linear infinite; }
    .orbit-ccw { transform-origin: center; animation: spinCounter 14s linear infinite; }
    .pulse-green { animation: pulseGlow 4s ease-in-out infinite; }
    .pulse-red { animation: pulseGlow 4s ease-in-out infinite 1.3s; }
    .pulse-cyan { animation: pulseGlow 4s ease-in-out infinite 2.6s; }
  </style>

  <!-- Deep Space Grid Background -->
  <rect width="1000" height="650" fill="url(#bg-grad)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  <!-- Main Header Title -->
  <text x="500" y="45" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#ffffff" filter="url(#glow-cyan)">APPLICATIONS, CHALLENGES  FUTURE</text>
  <text x="500" y="70" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="600" fill="#00ff88" letter-spacing="1.5">REAL-WORLD IMPACT, TECHNICAL BOTTLENECK  NEXT-GEN HORIZONS</text>

  <!-- ================= CONNECTING DATA PIPELINES ================= -->
  <!-- Left Pipeline: Applications <-> Challenges -->
  <path d="M 210,310 C 300,230 410,230 500,310" fill="none" stroke="#00ff88" stroke-width="2.5" opacity="0.6" stroke-dasharray="6 6" />
  <path d="M 210,310 C 300,390 410,390 500,310" fill="none" stroke="#ff5252" stroke-width="2.5" opacity="0.8" stroke-dasharray="10 10" style="animation: dataPulse 6s linear infinite;" />

  <!-- Right Pipeline: Challenges <-> Future -->
  <path d="M 500,310 C 590,230 700,230 790,310" fill="none" stroke="#ff5252" stroke-width="2.5" opacity="0.8" stroke-dasharray="10 10" style="animation: dataPulse 6s linear infinite;" />
  <path d="M 500,310 C 590,390 700,390 790,310" fill="none" stroke="#00f3ff" stroke-width="2.5" opacity="0.6" stroke-dasharray="6 6" />

  <!-- Travelling Data Stream Signals -->
  <g style="animation: particleFlowLeft 3s linear infinite;">
    <circle cx="0" cy="0" r="5" fill="#00ff88" filter="url(#glow-green)" />
  </g>
  <g style="animation: particleFlowRight 3s linear infinite 1.5s;">
    <circle cx="0" cy="0" r="5" fill="#00f3ff" filter="url(#glow-cyan)" />
  </g>

  <!-- ================= PILLAR 1: APPLICATIONS (LEFT - GREEN) ================= -->
  <g transform="translate(210, 310)">
    <circle cx="0" cy="0" r="115" fill="url(#app-glow)" class="pulse-green" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="6 4" class="orbit-cw" opacity="0.6" />

    <!-- Shield / Key Icon (QKD & Security) -->
    <g stroke="#00ff88" stroke-width="1.8" opacity="0.8" fill="none" transform="translate(0, -5)">
      <path d="M 0,-30 L 22,-18 L 22,5 C 22,20 0,32 0,32 C 0,32 -22,20 -22,5 L -22,-18 Z" fill="#021a10" />
      <circle cx="0" cy="-3" r="6" fill="#00ff88" />
      <path d="M 0,-3 L 0,12" stroke="#00ff88" stroke-width="2" />
    </g>

    <!-- Pillar Header -->
    <rect x="-85" y="-140" width="170" height="26" rx="6" fill="#021a10" stroke="#00ff88" stroke-width="1.2" />
    <text x="0" y="-123" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="700" fill="#00ff88" letter-spacing="1">APPLICATIONS</text>

    <!-- Subtext Details -->
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" text-anchor="middle">
      <text x="0" y="115" font-weight="700" fill="#00ff88">Quantum Cryptography  QKD</text>
      <text x="0" y="133" fill="#a3ffce">Distributed Supercomputing</text>
      <text x="0" y="148" fill="#a3ffce">Blind Quantum Cloud Computing</text>
    </g>
  </g>

  <!-- ================= PILLAR 2: CHALLENGES (CENTER - RED) ================= -->
  <g transform="translate(500, 310)">
    <circle cx="0" cy="0" r="125" fill="url(#chal-glow)" class="pulse-red" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="8 6" class="orbit-ccw" opacity="0.7" />

    <!-- Warning / Decoherence Icon -->
    <g stroke="#ff5252" stroke-width="2" fill="none" opacity="0.9" transform="translate(0, -2)">
      <polygon points="0,-28 -28,20 28,20" fill="#1f0707" stroke="#ff5252" />
      <line x1="0" y1="-8" x2="0" y2="6" stroke="#ff5252" stroke-width="2.5" />
      <circle cx="0" cy="13" r="1.5" fill="#ff5252" stroke="none" />
    </g>

    <!-- Pillar Header -->
    <rect x="-85" y="-140" width="170" height="26" rx="6" fill="#1c0505" stroke="#ff5252" stroke-width="1.2" />
    <text x="0" y="-123" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="700" fill="#ff5252" letter-spacing="1">CHALLENGES</text>

    <!-- Subtext Details -->
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" text-anchor="middle">
      <text x="0" y="115" font-weight="700" fill="#ff5252">Quantum Decoherence  Noise</text>
      <text x="0" y="133" fill="#ffb4b4">Fiber Signal Attenuation Loss</text>
      <text x="0" y="148" fill="#ffb4b4">Quantum Memory  Repeaters</text>
    </g>
  </g>

  <!-- ================= PILLAR 3: FUTURE HORIZONS (RIGHT - CYAN) ================= -->
  <g transform="translate(790, 310)">
    <circle cx="0" cy="0" r="115" fill="url(#fut-glow)" class="pulse-cyan" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="8 4" class="orbit-cw" opacity="0.6" />

    <!-- Satellite / Global Network Icon -->
    <g stroke="#00f3ff" stroke-width="1.5" opacity="0.8" fill="none" transform="translate(0, -2)">
      <circle cx="0" cy="0" r="22" stroke="#00f3ff" opacity="0.4" />
      <ellipse cx="0" cy="0" rx="28" ry="8" stroke="#00f3ff" transform="rotate(-30)" />
      <!-- Satellite body -->
      <rect x="-6" y="-6" width="12" height="12" fill="#04121a" stroke="#00f3ff" />
      <line x1="-16" y1="-6" x2="-6" y2="-6" stroke="#00f3ff" stroke-width="2" />
      <line x1="6" y1="6" x2="16" y2="6" stroke="#00f3ff" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" filter="url(#glow-intense)" />
    </g>

    <!-- Pillar Header -->
    <rect x="-85" y="-140" width="170" height="26" rx="6" fill="#04121a" stroke="#00f3ff" stroke-width="1.2" />
    <text x="0" y="-123" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="700" fill="#00f3ff" letter-spacing="1">FUTURE VISION</text>

    <!-- Subtext Details -->
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" text-anchor="middle">
      <text x="0" y="115" font-weight="700" fill="#00f3ff">Global Satellite Quantum Mesh</text>
      <text x="0" y="133" fill="#80fbff">Worldwide Quantum Internet</text>
      <text x="0" y="148" fill="#80fbff">Macroscopic State Teleportation</text>
    </g>
  </g>

  <!-- ================= BOTTOM ARABIC / ENGLISH SUMMARY PANEL ================= -->
  <g transform="translate(500, 575)">
    <rect x="-420" y="-24" width="840" height="46" rx="8" fill="#050a14" stroke="#1a2d48" stroke-width="1.5" />
    
    <!-- Arabic Description Line -->
    <text x="0" y="-5" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#00ff88">
      التطبيقات العملية والتحديات والآفاق المستقبلية: من تشفير البيانات والتغلب على التفكك الكمي إلى بناء الإنترنت الكمي العالمي
    </text>
    
    <!-- English Scientific Context Line -->
    <text x="0" y="13" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" fill="#7d9ec0">
      Securing Networks  Scaling QPUs while Solving Decoherence &amp; Memory Repeater Loss for Global Satellite Coverage
    </text>
  </g>
</svg>