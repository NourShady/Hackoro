<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bg-grad-s11" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    
    <linearGradient id="fiber-core-grad-s11" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.15" />
    </linearGradient>

    
    <linearGradient id="quantum-wave-s11" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>

    
    <linearGradient id="classical-wave-s11" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="50%" stop-color="#ffeb3b" />
      <stop offset="100%" stop-color="#ff9800" />
    </linearGradient>

    
    <radialGradient id="card-cyan-glow-s11" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="card-amber-glow-s11" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0" />
    </radialGradient>

    
    <filter id="glow-cyan-s11" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-amber-s11" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green-s11" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense-s11" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Dual-Channel Optical Fiber Propagation */
    @keyframes quantumStreamS11 {
      0% { stroke-dashoffset: 560; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes classicalStreamS11 {
      0% { stroke-dashoffset: 560; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes quantumPhotonMoveS11 {
      0% { transform: translate(-275px, -16px) scale(0.8); opacity: 0; }
      12% { opacity: 1; transform: translate(-275px, -16px) scale(1); }
      88% { opacity: 1; transform: translate(275px, -16px) scale(1); }
      100% { transform: translate(275px, -16px) scale(0.8); opacity: 0; }
    }
    @keyframes classicalPacket1S11 {
      0% { transform: translate(-275px, 16px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(275px, 16px); opacity: 0; }
    }
    @keyframes classicalPacket2S11 {
      0% { transform: translate(-275px, 16px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(275px, 16px); opacity: 0; }
    }
    @keyframes classicalPacket3S11 {
      0% { transform: translate(-275px, 16px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(275px, 16px); opacity: 0; }
    }
    @keyframes nodePulseS11 {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    .q-wave-s11 { stroke-dasharray: 14 8; animation: quantumStreamS11 4.5s linear infinite; }
    .c-wave-s11 { stroke-dasharray: 22 6; animation: classicalStreamS11 1.8s linear infinite; }
    .q-photon-s11 { animation: quantumPhotonMoveS11 4.5s ease-in-out infinite; }
    .c-pkt-1-s11 { animation: classicalPacket1S11 2.4s linear infinite; }
    .c-pkt-2-s11 { animation: classicalPacket2S11 2.4s linear infinite 0.8s; }
    .c-pkt-3-s11 { animation: classicalPacket3S11 2.4s linear infinite 1.6s; }
    .mux-pulse-s11 { transform-origin: center; animation: nodePulseS11 3s ease-in-out infinite; }
  </style>

  
  <rect width="1000" height="650" fill="url(#bg-grad-s11)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  
  
  <g transform="translate(500, 32)">
    <rect x="-125" y="-13" width="250" height="24" rx="12" fill="#061224" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" letter-spacing="2" fill="#00f3ff">SLIDE 11   |   SPEAKER 08</text>
  </g>

  
  <text x="500" y="75" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#glow-cyan-s11)">A 2024 OPTICAL-FIBER EXPERIMENT</text>

  
  <text x="500" y="101" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#7d9ec0">COEXISTENCE OF QUANTUM TELEPORTATION &amp; HIGH-SPEED TELECOM TRAFFIC</text>

  
  <g transform="translate(500, 226)">
    
    <rect x="-430" y="-102" width="860" height="204" rx="16" fill="#050b16" stroke="#1e2d42" stroke-width="1.6" />

    
    <line x1="-285" y1="-72" x2="285" y2="-72" stroke="#00f3ff" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7" />
    <polygon points="-290,-72 -280,-76 -280,-68" fill="#00f3ff" />
    <polygon points="290,-72 280,-76 280,-68" fill="#00f3ff" />
    <rect x="-98" y="-84" width="196" height="22" rx="11" fill="#041c2b" stroke="#00f3ff" stroke-width="1.2" />
    <text x="0" y="-69" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="900" fill="#00f3ff">30.2 KM OPTICAL FIBER</text>

    
    <rect x="-295" y="-36" width="590" height="72" rx="36" fill="url(#fiber-core-grad-s11)" stroke="#00f3ff" stroke-width="1.6" stroke-opacity="0.65" />
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 5" opacity="0.2" />

    
    <line x1="-275" y1="-16" x2="275" y2="-16" stroke="url(#quantum-wave-s11)" stroke-width="2.6" filter="url(#glow-cyan-s11)" class="q-wave-s11" />
    <text x="-175" y="-23" font-family="&#39;Courier New&#39;, monospace" font-size="9" font-weight="bold" fill="#00ff88">QUANTUM CHANNEL |Ψ⟩</text>

    
    <line x1="-275" y1="16" x2="275" y2="16" stroke="url(#classical-wave-s11)" stroke-width="2.6" filter="url(#glow-amber-s11)" class="c-wave-s11" />
    <text x="-175" y="29" font-family="&#39;Courier New&#39;, monospace" font-size="9" font-weight="bold" fill="#ffb74d">CLASSICAL TRAFFIC (400 Gbps)</text>

    
    <g class="q-photon-s11">
      <circle cx="0" cy="0" r="8" fill="#00ff88" stroke="#ffffff" stroke-width="1.2" filter="url(#glow-intense-s11)" />
      <text x="0" y="3" text-anchor="middle" font-family="&#39;Georgia&#39;, serif" font-style="italic" font-size="9" font-weight="bold" fill="#001a10">Ψ</text>
    </g>

    
    <g class="c-pkt-1-s11">
      <rect x="-12" y="-5" width="24" height="10" rx="3" fill="#ff9800" filter="url(#glow-amber-s11)" />
    </g>
    <g class="c-pkt-2-s11">
      <rect x="-12" y="-5" width="24" height="10" rx="3" fill="#ffeb3b" filter="url(#glow-amber-s11)" />
    </g>
    <g class="c-pkt-3-s11">
      <rect x="-12" y="-5" width="24" height="10" rx="3" fill="#ff9800" filter="url(#glow-amber-s11)" />
    </g>

    
    <g transform="translate(-350, 0)" class="mux-pulse-s11">
      <rect x="-56" y="-44" width="112" height="88" rx="12" fill="#061426" stroke="#00f3ff" stroke-width="1.8" filter="url(#glow-cyan-s11)" />
      <text x="0" y="-12" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">TRANSMITTER</text>
      <text x="0" y="6" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#00f3ff">WDM MUX</text>
      <text x="0" y="24" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="8.5" font-weight="bold" fill="#7d9ec0">Q + C INPUT</text>
    </g>

    
    <g transform="translate(350, 0)" class="mux-pulse-s11">
      <rect x="-56" y="-44" width="112" height="88" rx="12" fill="#061426" stroke="#00ff88" stroke-width="1.8" filter="url(#glow-green-s11)" />
      <text x="0" y="-12" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">RECEIVER</text>
      <text x="0" y="6" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#00ff88">WDM DEMUX</text>
      <text x="0" y="24" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="8.5" font-weight="bold" fill="#7d9ec0">STATE |Ψ⟩ OUT</text>
    </g>

    
    <text x="0" y="76" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10.5" font-weight="bold" fill="#00ff88">
      SINGLE FIBER CORE • ZERO SEPARATE DARK FIBER REQUIRED
    </text>
  </g>

  
  <g transform="translate(500, 412)">
    
    <g transform="translate(-220, 0)">
      <circle cx="0" cy="0" r="105" fill="url(#card-cyan-glow-s11)" />
      <rect x="-210" y="-56" width="420" height="112" rx="14" fill="#050e1c" stroke="#00f3ff" stroke-width="1.8" stroke-opacity="0.85" />
      
      
      <rect x="-190" y="-36" width="136" height="72" rx="10" fill="#031a29" stroke="#00f3ff" stroke-width="1.4" filter="url(#glow-cyan-s11)" />
      <text x="-122" y="7" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="26" font-weight="900" fill="#00f3ff">30.2 km</text>

      
      <text x="-38" y="-8" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Optical-fiber distance</text>
      <text x="-38" y="14" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="700" fill="#9deeff">used in the experiment</text>
    </g>

    
    <g transform="translate(220, 0)">
      <circle cx="0" cy="0" r="105" fill="url(#card-amber-glow-s11)" />
      <rect x="-210" y="-56" width="420" height="112" rx="14" fill="#120b04" stroke="#ff9800" stroke-width="1.8" stroke-opacity="0.85" />
      
      
      <rect x="-190" y="-36" width="146" height="72" rx="10" fill="#211303" stroke="#ff9800" stroke-width="1.4" filter="url(#glow-amber-s11)" />
      <text x="-117" y="7" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffeb3b">400 Gbps</text>

      
      <text x="-28" y="-8" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Simultaneous classical</text>
      <text x="-28" y="14" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffb74d">data transmission rate</text>
    </g>
  </g>

  
  <g transform="translate(500, 526)">
    <rect x="-430" y="-32" width="860" height="64" rx="12" fill="#041c14" stroke="#00ff88" stroke-width="1.8" filter="url(#glow-green-s11)" />
    <rect x="-410" y="-14" width="142" height="28" rx="7" fill="#062e21" stroke="#00ff88" stroke-width="1.2" />
    <text x="-339" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#00ff88">BREAKTHROUGH</text>
    
    <text x="-248" y="5" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff">
      Quantum Teleportation coexisted with <tspan fill="#00ff88">classical communications.</tspan>
    </text>
  </g>

  
  <g transform="translate(500, 598)">
    <rect x="-430" y="-18" width="860" height="34" rx="8" fill="#050a14" stroke="#1a2d48" stroke-width="1.5" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#7d9ec0">
      <tspan fill="#00f3ff">IMPACT:</tspan> Quantum Networks Can Run Directly Over Existing <tspan fill="#ff9800">High-Speed Internet Infrastructure</tspan>
    </text>
  </g>
</svg>