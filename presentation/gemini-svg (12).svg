    </g>

    
    <g transform="translate(265, 0)">
      <circle cx="0" cy="0" r="92" fill="url(#reg-b-glow-s13)" />
      <rect x="-135" y="-84" width="270" height="168" rx="14" fill="#14061c" stroke="#e040fb" stroke-width="1.8" stroke-opacity="0.8" />
      
      
      <rect x="-112" y="-74" width="224" height="22" rx="11" fill="#270a36" stroke="#e040fb" stroke-width="1" />
      <text x="0" y="-59" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1" fill="#e040fb">SOLID-STATE REGISTER B</text>

      
      <g stroke="#e040fb" stroke-width="1" opacity="0.3">
        <rect x="-70" y="-36" width="140" height="68" rx="8" fill="#0e0414" />
        <line x1="-70" y1="-14" x2="70" y2="-14" />
        <line x1="-70" y1="10" x2="70" y2="10" />
        <line x1="-25" y1="-36" x2="-25" y2="32" />
        <line x1="25" y1="-36" x2="25" y2="32" />
      </g>

      
      <circle cx="-10" cy="-6" r="24" fill="none" stroke="#e040fb" stroke-width="1.2" stroke-dasharray="4 3" class="orbit-ccw-s13" />
      <text x="46" y="-2" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#f3a6ff">TARGET</text>
      <text x="46" y="10" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#e040fb">QUBIT</text>

      
      <text x="0" y="60" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#e040fb">REMOTE PROCESSOR NODE 02</text>
    </g>

    
    <g class="cnot-targ-s13">
      <circle cx="255" cy="-6" r="14" fill="#240830" stroke="#00ff88" stroke-width="2.2" filter="url(#glow-green-s13)" />
      <line x1="244" y1="-6" x2="266" y2="-6" stroke="#00ff88" stroke-width="2.2" />
      <line x1="255" y1="-17" x2="255" y2="5" stroke="#00ff88" stroke-width="2.2" />
    </g>
  </g>

  
  <g transform="translate(500, 456)">
    
    <g transform="translate(-220, -48)">
      <rect x="-210" y="-32" width="420" height="64" rx="12" fill="#070e1c" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.7" />
      <rect x="-192" y="-16" width="84" height="32" rx="8" fill="#031d2b" stroke="#00f3ff" stroke-width="1.2" />
