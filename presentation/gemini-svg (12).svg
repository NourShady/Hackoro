      <text x="-94" y="-4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Research published in</text>
      <text x="-94" y="15" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="900" fill="#00f3ff">Nature Communications (2026)</text>
    </g>

    
    <g transform="translate(220, -48)">
      <rect x="-210" y="-32" width="420" height="64" rx="12" fill="#070e1c" stroke="#e040fb" stroke-width="1.5" stroke-opacity="0.7" />
      <rect x="-192" y="-16" width="84" height="32" rx="8" fill="#230730" stroke="#e040fb" stroke-width="1.2" />
      <text x="-150" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10.5" font-weight="bold" fill="#e040fb">LOGIC GATE</text>
      <text x="-94" y="-4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Demonstrated a</text>
      <text x="-94" y="15" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="900" fill="#f3a6ff">Controlled-NOT (CNOT) gate</text>
    </g>

    
    <g transform="translate(-220, 32)">
      <rect x="-210" y="-32" width="420" height="64" rx="12" fill="#070e1c" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.7" />
      <rect x="-192" y="-16" width="84" height="32" rx="8" fill="#031d2b" stroke="#00f3ff" stroke-width="1.2" />
      <text x="-150" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10.5" font-weight="bold" fill="#00f3ff">HARDWARE</text>
      <text x="-94" y="-4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Connected separate</text>
      <text x="-94" y="15" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#9deeff">solid-state qubit registers</text>
    </g>

    
    <g transform="translate(220, 32)">
      <rect x="-210" y="-32" width="420" height="64" rx="12" fill="#041914" stroke="#00ff88" stroke-width="1.6" />
      <rect x="-192" y="-16" width="84" height="32" rx="8" fill="#062b22" stroke="#00ff88" stroke-width="1.2" />
      <text x="-150" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10.5" font-weight="bold" fill="#00ff88">MILESTONE</text>
      <text x="-94" y="-4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff">A step toward</text>
      <text x="-94" y="15" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="900" fill="#00ff88">networked quantum computing</text>
    </g>
