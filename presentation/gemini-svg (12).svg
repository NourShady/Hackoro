<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bg-grad-s13" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    
    <radialGradient id="reg-a-glow-s13" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="reg-b-glow-s13" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e040fb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e040fb" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="qbus-grad-s13" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#e040fb" />
    </linearGradient>

    
    <filter id="glow-cyan-s13" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple-s13" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green-s13" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense-s13" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Distributed Gate Execution Animations */
    @keyframes entangleLinkFlowS13 {
      0% { stroke-dashoffset: 340; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cnotControlPulseS13 {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      45% { transform: scale(1.22); opacity: 1; }
    }
    @keyframes cnotTargetSpinS13 {
      0%, 40% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(180deg); }
    }
    @keyframes gatePacketTransitS13 {
      0% { transform: translate(-155px, 0px) scale(0.75); opacity: 0; }
      15% { opacity: 1; transform: translate(-155px, 0px) scale(1); }
      50% { transform: translate(0px, -26px) scale(1.1); opacity: 1; }
      85% { opacity: 1; transform: translate(155px, 0px) scale(1); }
      100% { transform: translate(155px, 0px) scale(0.75); opacity: 0; }
    }
    @keyframes spinClockwiseS13 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounterS13 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .qbus-stream-s13 { stroke-dasharray: 10 6; animation: entangleLinkFlowS13 3.5s linear infinite; }
    .cnot-ctrl-s13 { transform-origin: -255px -6px; animation: cnotControlPulseS13 4s ease-in-out infinite; }
    .cnot-targ-s13 { transform-origin: 255px -6px; animation: cnotTargetSpinS13 4s ease-in-out infinite; }
    .gate-transit-s13 { animation: gatePacketTransitS13 4s ease-in-out infinite; }
    .orbit-cw-s13 { transform-origin: center; animation: spinClockwiseS13 9s linear infinite; }
    .orbit-ccw-s13 { transform-origin: center; animation: spinCounterS13 12s linear infinite; }
  </style>

  
  <rect width="1000" height="650" fill="url(#bg-grad-s13)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  
  
  <g transform="translate(500, 32)">
    <rect x="-125" y="-13" width="250" height="24" rx="12" fill="#061224" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" letter-spacing="2" fill="#00f3ff">SLIDE 13   |   SPEAKER 09</text>
  </g>

  
  <text x="500" y="75" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="29" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#glow-cyan-s13)">DISTRIBUTED QUANTUM COMPUTING</text>

  
  <g transform="translate(500, 105)">
    <rect x="-235" y="-13" width="470" height="24" rx="12" fill="#041914" stroke="#00ff88" stroke-width="1.2" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="2" fill="#00ff88">TELEPORTED QUANTUM GATES BETWEEN REMOTE SYSTEMS</text>
  </g>

  
  <g transform="translate(500, 238)">
    
    <rect x="-430" y="-108" width="860" height="216" rx="16" fill="#050b16" stroke="#1e2d42" stroke-width="1.6" />

    
    <path d="M -135,-6 C -60,-46 60,-46 135,-6" fill="none" stroke="url(#qbus-grad-s13)" stroke-width="2.4" filter="url(#glow-cyan-s13)" class="qbus-stream-s13" />
    <line x1="-135" y1="24" x2="135" y2="24" stroke="#ff9800" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.8" />
    
    
    <rect x="-86" y="-62" width="172" height="22" rx="11" fill="#041c14" stroke="#00ff88" stroke-width="1.2" />
    <text x="0" y="-47" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold" fill="#00ff88">TELEPORTED CNOT GATE</text>

    <rect x="-78" y="32" width="156" height="18" rx="6" fill="#1c1104" stroke="#ff9800" stroke-width="0.9" />
    <text x="0" y="44" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9" font-weight="bold" fill="#ffb74d">ENTANGLEMENT + CLASSICAL</text>

    
    <g class="gate-transit-s13">
