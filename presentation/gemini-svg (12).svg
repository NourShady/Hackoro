      <text x="0" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10.5" font-weight="900" fill="#ffffff">CNOT</text>
    </g>

    
    <g transform="translate(-265, 0)">
      <circle cx="0" cy="0" r="92" fill="url(#reg-a-glow-s13)" />
      <rect x="-135" y="-84" width="270" height="168" rx="14" fill="#04121f" stroke="#00f3ff" stroke-width="1.8" stroke-opacity="0.8" />
      
      
      <rect x="-112" y="-74" width="224" height="22" rx="11" fill="#062036" stroke="#00f3ff" stroke-width="1" />
      <text x="0" y="-59" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1" fill="#00f3ff">SOLID-STATE REGISTER A</text>

      
      <g stroke="#00f3ff" stroke-width="1" opacity="0.3">
        <rect x="-70" y="-36" width="140" height="68" rx="8" fill="#030d17" />
        <line x1="-70" y1="-14" x2="70" y2="-14" />
        <line x1="-70" y1="10" x2="70" y2="10" />
        <line x1="-25" y1="-36" x2="-25" y2="32" />
        <line x1="25" y1="-36" x2="25" y2="32" />
      </g>

      
      <circle cx="10" cy="-6" r="24" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-dasharray="4 3" class="orbit-cw-s13" />
      <text x="-46" y="-2" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#9deeff">CONTROL</text>
      <text x="-46" y="10" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#00f3ff">QUBIT</text>

      
      <text x="0" y="60" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#00f3ff">LOCAL PROCESSOR NODE 01</text>
    </g>

    
