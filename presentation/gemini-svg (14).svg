<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bg-grad-s15" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    
    <radialGradient id="core-halo-s15" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#e040fb" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    
    <filter id="glow-cyan-s15" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple-s15" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green-s15" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense-s15" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Quantum Core &amp; Horizon Animations */
    @keyframes orbitClockwiseS15 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbitCounterS15 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes corePulseS15 {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes horizonFlowS15 {
      0% { stroke-dashoffset: 320; }
      100% { stroke-dashoffset: 0; }
    }

    .orbit-cw-s15 { transform-origin: center; animation: orbitClockwiseS15 14s linear infinite; }
    .orbit-ccw-s15 { transform-origin: center; animation: orbitCounterS15 18s linear infinite; }
    .core-pulse-s15 { transform-origin: center; animation: corePulseS15 4s ease-in-out infinite; }
    .horizon-line-s15 { stroke-dasharray: 12 6; animation: horizonFlowS15 5s linear infinite; }
  </style>

  
  <rect width="1000" height="650" fill="url(#bg-grad-s15)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  
  
  <g transform="translate(500, 32)">
    <rect x="-125" y="-13" width="250" height="24" rx="12" fill="#061224" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" letter-spacing="2" fill="#00f3ff">SLIDE 15   |   SPEAKER 10</text>
  </g>

  
  <text x="500" y="76" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="3.5" fill="#ffffff" filter="url(#glow-cyan-s15)">
    CONCLUSION: <tspan fill="#00f3ff">WHAT DOES THE FUTURE HOLD?</tspan>
  </text>

  
  <text x="500" y="102" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#7d9ec0">KEY TAKEAWAYS &amp; THE ROAD AHEAD FOR QUANTUM TELEPORTATION</text>

  
  <g transform="translate(500, 342)">
    
    <circle cx="0" cy="0" r="210" fill="url(#core-halo-s15)" />

    
    <g stroke-width="1.8" opacity="0.65" class="horizon-line-s15">
      <line x1="-92" y1="-48" x2="-155" y2="-98" stroke="#00f3ff" />
      <line x1="92" y1="-48" x2="155" y2="-98" stroke="#e040fb" />
      <line x1="-92" y1="48" x2="-155" y2="98" stroke="#00ff88" />
      <line x1="92" y1="48" x2="155" y2="98" stroke="#ff9800" />
    </g>

    
    <g class="core-pulse-s15">
      <circle cx="0" cy="0" r="88" fill="#040d1a" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="74" fill="none" stroke="#00f3ff" stroke-width="1.6" stroke-dasharray="10 6" class="orbit-cw-s15" />
      <circle cx="0" cy="0" r="58" fill="none" stroke="#e040fb" stroke-width="1.4" stroke-dasharray="6 6" class="orbit-ccw-s15" />
      <ellipse cx="0" cy="0" rx="80" ry="26" fill="none" stroke="#00ff88" stroke-width="1.2" opacity="0.7" />
      <circle cx="0" cy="0" r="36" fill="#061d2e" stroke="#00f3ff" stroke-width="2" filter="url(#glow-intense-s15)" />
      <text x="0" y="9" text-anchor="middle" font-family="&#39;Georgia&#39;, serif" font-style="italic" font-size="28" font-weight="bold" fill="#ffffff">|Ψ⟩</text>
      <text x="0" y="104" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold" letter-spacing="1.5" fill="#00f3ff">QUANTUM REALITY</text>
    </g>

    
    <g transform="translate(-295, -105)">
      <rect x="-155" y="-68" width="310" height="136" rx="14" fill="#05101f" stroke="#00f3ff" stroke-width="1.8" stroke-opacity="0.85" />
      <rect x="-138" y="-52" width="114" height="22" rx="5" fill="#042236" stroke="#00f3ff" stroke-width="1" />
      <text x="-81" y="-37" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold" fill="#00f3ff">01 • PRINCIPLE</text>

      <circle cx="-132" cy="2" r="5" fill="#00f3ff" filter="url(#glow-cyan-s15)" />
      <text x="-118" y="0" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">Quantum Teleportation</text>
      <text x="-118" y="21" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#00f3ff">transfers quantum states —</text>
      <text x="-118" y="42" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#9deeff">not people or objects.</text>
    </g>

    
    <g transform="translate(295, -105)">
      <rect x="-155" y="-68" width="310" height="136" rx="14" fill="#110619" stroke="#e040fb" stroke-width="1.8" stroke-opacity="0.85" />
      <rect x="-138" y="-52" width="114" height="22" rx="5" fill="#250936" stroke="#e040fb" stroke-width="1" />
      <text x="-81" y="-37" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold" fill="#e040fb">02 • EVIDENCE</text>

      <circle cx="-132" cy="2" r="5" fill="#e040fb" filter="url(#glow-purple-s15)" />
      <text x="-118" y="0" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">It is already demonstrated</text>
      <text x="-118" y="21" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#f3a6ff">in scientific</text>
      <text x="-118" y="42" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#e040fb">experiments.</text>
    </g>

    
    <g transform="translate(-295, 105)">
      <rect x="-155" y="-68" width="310" height="136" rx="14" fill="#041712" stroke="#00ff88" stroke-width="1.8" stroke-opacity="0.85" />
      <rect x="-138" y="-52" width="114" height="22" rx="5" fill="#062b22" stroke="#00ff88" stroke-width="1" />
      <text x="-81" y="-37" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold" fill="#00ff88">03 • FUTURE</text>

      <circle cx="-132" cy="2" r="5" fill="#00ff88" filter="url(#glow-green-s15)" />
      <text x="-118" y="0" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">It may help advance</text>
      <text x="-118" y="21" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#00ff88">quantum communication</text>
      <text x="-118" y="42" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#9effd2">and computing.</text>
    </g>

    
    <g transform="translate(295, 105)">
      <rect x="-155" y="-68" width="310" height="136" rx="14" fill="#170f05" stroke="#ff9800" stroke-width="1.8" stroke-opacity="0.85" />
      <rect x="-138" y="-52" width="114" height="22" rx="5" fill="#2e1b06" stroke="#ff9800" stroke-width="1" />
      <text x="-81" y="-37" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold" fill="#ffb74d">04 • VERDICT</text>

      <circle cx="-132" cy="2" r="5" fill="#ff9800" />
      <text x="-118" y="0" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="900" fill="#00ff88">The science is real.</text>
      <text x="-118" y="21" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">Human teleportation is</text>
      <text x="-118" y="42" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffb74d">not currently possible.</text>
    </g>
  </g>

  
  <g transform="translate(500, 602)">
    <rect x="-450" y="-18" width="900" height="34" rx="8" fill="#050a14" stroke="#1a2d48" stroke-width="1.5" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#7d9ec0">
     |  FROM NIKOLA TESLA'S VISION TO QUANTUM REALITY 
    </text>
  </g>
</svg>