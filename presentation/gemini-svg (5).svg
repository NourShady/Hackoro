<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bg-grad-s6" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    
    <radialGradient id="classical-glow-s6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="quantum-glow-s6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="bloch-sphere-s6" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#006064" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#02121a" stop-opacity="0.6" />
    </radialGradient>

    
    <filter id="glow-cyan-s6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-orange-s6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense-s6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Classical Bit Toggle (0 OR 1) */
    @keyframes bitSwitchZeroS6 {
      0%, 48% { opacity: 1; transform: scale(1); }
      50%, 98% { opacity: 0; transform: scale(0.75); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes bitSwitchOneS6 {
      0%, 48% { opacity: 0; transform: scale(0.75); }
      50%, 98% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.75); }
    }
    @keyframes switchLeverS6 {
      0%, 48% { transform: translateX(-28px); }
      50%, 98% { transform: translateX(28px); }
      100% { transform: translateX(-28px); }
    }

    /* Quantum Qubit Superposition &amp; Measurement Collapse Loop (7s) */
    @keyframes spinClockwiseS6 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounterS6 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes blochVectorPrecessS6 {
      0%, 58% { transform: rotate(-38deg); }
      25% { transform: rotate(42deg); }
      45% { transform: rotate(-25deg); }
      65%, 92% { transform: rotate(0deg); }
      100% { transform: rotate(-38deg); }
    }
    @keyframes measureLaserS6 {
      0%, 54% { opacity: 0; transform: scaleX(0.4); }
      60% { opacity: 1; transform: scaleX(1.1); }
      68%, 100% { opacity: 0; transform: scaleX(1); }
    }
    @keyframes stateLabelSuperS6 {
      0%, 58% { opacity: 1; }
      62%, 94% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes stateLabelCollapsedS6 {
      0%, 58% { opacity: 0; }
      62%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }

    .bit-zero-s6 { animation: bitSwitchZeroS6 3.6s steps(1) infinite; }
    .bit-one-s6 { animation: bitSwitchOneS6 3.6s steps(1) infinite; }
    .switch-lever-s6 { animation: switchLeverS6 3.6s ease-in-out infinite; }
    .orbit-cw-s6 { transform-origin: center; animation: spinClockwiseS6 9s linear infinite; }
    .orbit-ccw-s6 { transform-origin: center; animation: spinCounterS6 13s linear infinite; }
    .bloch-vector-s6 { transform-origin: 0px 0px; animation: blochVectorPrecessS6 7s ease-in-out infinite; }
    .measure-flash-s6 { transform-origin: center; animation: measureLaserS6 7s ease-out infinite; }
    .label-super-s6 { animation: stateLabelSuperS6 7s infinite; }
    .label-collapse-s6 { animation: stateLabelCollapsedS6 7s infinite; }
  </style>

  
  <rect width="1000" height="650" fill="url(#bg-grad-s6)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  
  
  <g transform="translate(500, 32)">
    <rect x="-125" y="-13" width="250" height="24" rx="12" fill="#061224" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" letter-spacing="2" fill="#00f3ff">SLIDE 06   |   SPEAKER 05</text>
  </g>

  
  <text x="500" y="76" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="30" font-weight="900" letter-spacing="5" fill="#ffffff" filter="url(#glow-cyan-s6)">BIT VS. QUBIT</text>

  
  <text x="500" y="102" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#7d9ec0">CLASSICAL DETERMINISM VS. QUANTUM SUPERPOSITION</text>

  
  <line x1="500" y1="135" x2="500" y2="545" stroke="#1e2d42" stroke-width="2" stroke-dasharray="6 6" />
  <g transform="translate(500, 340)">
    <circle cx="0" cy="0" r="24" fill="#04060b" stroke="#1e2d42" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="800" fill="#7d9ec0">VS</text>
  </g>

  
  <g transform="translate(245, 340)">
    <circle cx="0" cy="0" r="150" fill="url(#classical-glow-s6)" />
    <rect x="-200" y="-195" width="400" height="390" rx="16" fill="#0c0804" stroke="#ff9800" stroke-width="2" stroke-opacity="0.85" />

    
    <rect x="-125" y="-175" width="250" height="28" rx="14" fill="#1f1103" stroke="#ff9800" stroke-width="1.2" />
    <text x="0" y="-157" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#ff9800">CLASSICAL COMPUTING</text>

    
    <g transform="translate(0, -45)">
      
      <rect x="-46" y="-46" width="92" height="92" rx="14" fill="#1c1104" stroke="#ff9800" stroke-width="2.2" filter="url(#glow-orange-s6)" />

      
      <g class="bit-zero-s6">
        <text x="0" y="16" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="48" font-weight="900" fill="#ff9800" filter="url(#glow-intense-s6)">0</text>
      </g>

      
      <g class="bit-one-s6">
        <text x="0" y="16" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="48" font-weight="900" fill="#ffb74d" filter="url(#glow-intense-s6)">1</text>
      </g>

      
      <rect x="-56" y="58" width="112" height="22" rx="11" fill="#140c03" stroke="#ff9800" stroke-width="1.2" />
      <text x="-30" y="73" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#ff9800">0</text>
      <text x="30" y="73" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#ffb74d">1</text>
      <g class="switch-lever-s6">
        <circle cx="0" cy="69" r="8" fill="#ff9800" filter="url(#glow-orange-s6)" />
      </g>
    </g>

    
    <rect x="-175" y="65" width="350" height="105" rx="10" fill="#140c04" stroke="#ff9800" stroke-width="1" stroke-opacity="0.4" />
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" text-anchor="start">
      <circle cx="-150" cy="102" r="5" fill="#ff9800" filter="url(#glow-orange-s6)" />
      <text x="-136" y="107" font-size="16" font-weight="800" fill="#ffffff">Bit = 0 or 1</text>
      <text x="-136" y="132" font-size="12" font-weight="500" fill="#d9a779">Strictly one definite state at a time</text>
    </g>
  </g>

  
  <g transform="translate(755, 340)">
    <circle cx="0" cy="0" r="150" fill="url(#quantum-glow-s6)" />
    <rect x="-200" y="-195" width="400" height="390" rx="16" fill="#040d14" stroke="#00f3ff" stroke-width="2" stroke-opacity="0.85" />

    
    <rect x="-125" y="-175" width="250" height="28" rx="14" fill="#031926" stroke="#00f3ff" stroke-width="1.2" />
    <text x="0" y="-157" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#00f3ff">QUANTUM COMPUTING</text>

    
    <g transform="translate(0, -52)">
      
      <text x="0" y="-56" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#00ff88">|0⟩</text>
      <text x="0" y="66" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#00f3ff">|1⟩</text>

      
      <circle cx="0" cy="0" r="46" fill="url(#bloch-sphere-s6)" stroke="#00f3ff" stroke-width="1.6" />
      
      <ellipse cx="0" cy="0" rx="46" ry="14" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="4 3" opacity="0.65" />
      <ellipse cx="0" cy="0" rx="14" ry="46" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="4 3" opacity="0.45" />
      
      <line x1="0" y1="-46" x2="0" y2="46" stroke="#7d9ec0" stroke-width="1" stroke-dasharray="2 2" />

      
      <g class="bloch-vector-s6">
        <line x1="0" y1="0" x2="0" y2="-40" stroke="#00ff88" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan-s6)" />
        <polygon points="0,-46 -5,-35 5,-35" fill="#00ff88" filter="url(#glow-intense-s6)" />
      </g>
      <circle cx="0" cy="0" r="4" fill="#ffffff" />

      
      <g class="measure-flash-s6">
        <line x1="-68" y1="0" x2="68" y2="0" stroke="#ffeb3b" stroke-width="2.5" filter="url(#glow-intense-s6)" />
        <rect x="52" y="-10" width="56" height="20" rx="4" fill="#292102" stroke="#ffeb3b" stroke-width="1" />
        <text x="80" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="8.5" font-weight="bold" fill="#ffeb3b">MEASURE</text>
      </g>

      
      <g transform="translate(0, 82)">
        <g class="label-super-s6">
          <rect x="-110" y="-11" width="220" height="20" rx="6" fill="#031b26" stroke="#00f3ff" stroke-width="1" />
          <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#00f3ff">SUPERPOSITION: α|0⟩ + β|1⟩</text>
        </g>
        <g class="label-collapse-s6">
          <rect x="-110" y="-11" width="220" height="20" rx="6" fill="#032116" stroke="#00ff88" stroke-width="1" />
          <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#00ff88">MEASURED RESULT: |0⟩</text>
        </g>
      </g>
    </g>

    
    <rect x="-175" y="55" width="350" height="122" rx="10" fill="#04121c" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.4" />
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" text-anchor="start">
      <circle cx="-152" cy="80" r="4" fill="#00f3ff" />
      <text x="-140" y="84" font-size="13" font-weight="700" fill="#ffffff">Qubit = a quantum state</text>

      <circle cx="-152" cy="112" r="4" fill="#00f3ff" />
      <text x="-140" y="116" font-size="12.5" font-weight="700" fill="#9deeff">Can exist in a Superposition of 0 and 1</text>

      <circle cx="-152" cy="144" r="4" fill="#00ff88" />
      <text x="-140" y="148" font-size="12.5" font-weight="700" fill="#00ff88">Measurement gives a definite result: 0 or 1</text>
    </g>
  </g>

  
  <g transform="translate(500, 595)">
    <rect x="-420" y="-20" width="840" height="38" rx="8" fill="#050a14" stroke="#1a2d48" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11.5" font-weight="bold" fill="#7d9ec0">
      <tspan fill="#ff9800">BIT:</tspan> Deterministic (0 or 1)  |  <tspan fill="#00f3ff">QUBIT:</tspan> Superposition before Measurement → <tspan fill="#00ff88">Definite 0 or 1 upon Observation</tspan>
    </text>
  </g>
</svg>