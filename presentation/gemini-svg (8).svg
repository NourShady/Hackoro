<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    
    <radialGradient id="bg-grad-s9" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    
    <radialGradient id="alice-glow-s9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="bob-glow-s9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e040fb" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e040fb" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="psi-sphere-s9" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#ffeb3b" />
      <stop offset="100%" stop-color="#ff9800" />
    </radialGradient>

    
    <radialGradient id="qubit-cyan-s9" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#006064" />
    </radialGradient>

    
    <filter id="glow-cyan-s9" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple-s9" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-amber-s9" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense-s9" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous 4-Step Protocol Loop (10s) */
    @keyframes spinClockwiseS9 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounterS9 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    /* Step 1: |Ψ⟩ &amp; Qubit A converge into BSM */
    @keyframes convergePsiS9 {
      0%, 6% { transform: translate(-310px, -16px) scale(1); opacity: 1; }
      20% { transform: translate(-255px, -16px) scale(1.1); opacity: 1; }
      26%, 100% { transform: translate(-255px, -16px) scale(0); opacity: 0; }
    }
    @keyframes convergeQubitAS9 {
      0%, 6% { transform: translate(-200px, -16px) scale(1); opacity: 1; }
      20% { transform: translate(-255px, -16px) scale(1.1); opacity: 1; }
      26%, 100% { transform: translate(-255px, -16px) scale(0); opacity: 0; }
    }
    /* Step 1 &amp; 2: BSM Flash &amp; Outcome Highlight */
    @keyframes bsmFlashS9 {
      0%, 19% { transform: scale(0); opacity: 0; }
      24% { transform: scale(1.8); opacity: 1; }
      32%, 100% { transform: scale(0); opacity: 0; }
    }
    @keyframes outcomeActiveS9 {
      0%, 22% { opacity: 0.35; }
      28%, 68% { opacity: 1; }
      75%, 100% { opacity: 0.35; }
    }
    /* Step 3: Classical Channel Beam &amp; 2-Bit Packet */
    @keyframes classicalBeamS9 {
      0%, 30% { stroke-dashoffset: 480; opacity: 0; }
      35% { opacity: 1; }
      58% { stroke-dashoffset: 0; opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes classicalPacketS9 {
      0%, 30% { transform: translate(-145px, -16px) scale(0.7); opacity: 0; }
      35% { opacity: 1; transform: translate(-145px, -16px) scale(1); }
      58% { transform: translate(145px, -16px) scale(1); opacity: 1; }
      64%, 100% { transform: translate(145px, -16px) scale(0.7); opacity: 0; }
    }
    /* Step 4: Unitary Gate U Activation &amp; Bob Qubit Transformation */
    @keyframes gatePulseS9 {
      0%, 60% { transform: scale(1); stroke-opacity: 0.6; }
      68% { transform: scale(1.14); stroke-opacity: 1; filter: drop-shadow(0 0 12px #e040fb); }
      78%, 100% { transform: scale(1); stroke-opacity: 0.6; }
    }
    @keyframes bobQubitInitialS9 {
      0%, 66% { opacity: 1; transform: scale(1); }
      72%, 94% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes bobQubitReconstructedS9 {
      0%, 66% { opacity: 0; transform: scale(0.5); }
      74%, 94% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 0; transform: scale(0.5); }
    }

    .orbit-cw-s9 { transform-origin: center; animation: spinClockwiseS9 9s linear infinite; }
    .orbit-ccw-s9 { transform-origin: center; animation: spinCounterS9 12s linear infinite; }
    .psi-move-s9 { animation: convergePsiS9 10s ease-in-out infinite; }
    .qa-move-s9 { animation: convergeQubitAS9 10s ease-in-out infinite; }
    .bsm-flash-s9 { transform-origin: -255px -16px; animation: bsmFlashS9 10s ease-out infinite; }
    .outcome-highlight-s9 { animation: outcomeActiveS9 10s infinite; }
    .classical-stream-s9 { stroke-dasharray: 480; animation: classicalBeamS9 10s linear infinite; }
    .classical-packet-s9 { animation: classicalPacketS9 10s ease-in-out infinite; }
    .gate-u-s9 { transform-origin: 215px -16px; animation: gatePulseS9 10s ease-in-out infinite; }
    .bob-init-s9 { transform-origin: 315px -16px; animation: bobQubitInitialS9 10s ease-in-out infinite; }
    .bob-final-s9 { transform-origin: 315px -16px; animation: bobQubitReconstructedS9 10s ease-in-out infinite; }
  </style>

  
  <rect width="1000" height="650" fill="url(#bg-grad-s9)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  
  
  <g transform="translate(500, 32)">
    <rect x="-125" y="-13" width="250" height="24" rx="12" fill="#061224" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="3" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" letter-spacing="2" fill="#00f3ff">SLIDE 09   |   SPEAKER 07</text>
  </g>

  
  <text x="500" y="75" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#glow-cyan-s9)">FROM MEASUREMENT TO TRANSFER</text>

  
  <text x="500" y="101" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#7d9ec0">BELL-STATE MEASUREMENT, CLASSICAL BITS &amp; QUANTUM RECONSTRUCTION</text>

  
  <g transform="translate(500, 232)">
    
    <rect x="-430" y="-108" width="860" height="216" rx="16" fill="#050b16" stroke="#1e2d42" stroke-width="1.6" />

    
    <line x1="-145" y1="-16" x2="145" y2="-16" stroke="#1a293d" stroke-width="8" stroke-linecap="round" />
    <line x1="-145" y1="-16" x2="145" y2="-16" stroke="#ff9800" stroke-width="3" stroke-linecap="round" filter="url(#glow-amber-s9)" class="classical-stream-s9" />
    <rect x="-86" y="-44" width="172" height="20" rx="10" fill="#1c1104" stroke="#ff9800" stroke-width="1" />
    <text x="0" y="-31" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#ff9800">CLASSICAL CHANNEL</text>

    
    <g transform="translate(-255, -12)">
      <circle cx="0" cy="0" r="88" fill="url(#alice-glow-s9)" />
      <rect x="-155" y="-82" width="310" height="164" rx="14" fill="#04121f" stroke="#00f3ff" stroke-width="1.6" stroke-opacity="0.75" />
      
      
      <rect x="-105" y="-72" width="210" height="22" rx="11" fill="#062036" stroke="#00f3ff" stroke-width="1" />
      <text x="0" y="-57" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1" fill="#00f3ff">BELL-STATE MEASUREMENT</text>

      
      <circle cx="0" cy="-4" r="28" fill="none" stroke="#00f3ff" stroke-width="1.3" stroke-dasharray="5 3" class="orbit-cw-s9" />
      <text x="0" y="36" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#00f3ff">BSM DETECTOR</text>

      
      <g transform="translate(0, 60)" font-family="&#39;Courier New&#39;, monospace" font-size="10" font-weight="bold">
        <rect x="-126" y="-10" width="54" height="20" rx="5" fill="#071a2b" stroke="#00f3ff" stroke-width="1" opacity="0.45" />
        <text x="-99" y="4" text-anchor="middle" fill="#7d9ec0">00</text>

        <rect x="-60" y="-10" width="54" height="20" rx="5" fill="#071a2b" stroke="#00f3ff" stroke-width="1" opacity="0.45" />
        <text x="-33" y="4" text-anchor="middle" fill="#7d9ec0">01</text>

        
        <g class="outcome-highlight-s9">
          <rect x="6" y="-10" width="54" height="20" rx="5" fill="#261603" stroke="#ff9800" stroke-width="1.5" filter="url(#glow-amber-s9)" />
          <text x="33" y="4" text-anchor="middle" fill="#ffeb3b">10</text>
        </g>

        <rect x="72" y="-10" width="54" height="20" rx="5" fill="#071a2b" stroke="#00f3ff" stroke-width="1" opacity="0.45" />
        <text x="99" y="4" text-anchor="middle" fill="#7d9ec0">11</text>
      </g>
    </g>

    
    <g class="psi-move-s9">
      <circle cx="0" cy="0" r="13" fill="url(#psi-sphere-s9)" filter="url(#glow-amber-s9)" />
      <text x="0" y="4" text-anchor="middle" font-family="&#39;Georgia&#39;, serif" font-style="italic" font-size="12" font-weight="bold" fill="#1a0c00">|Ψ⟩</text>
    </g>
    <g class="qa-move-s9">
      <circle cx="0" cy="0" r="13" fill="url(#qubit-cyan-s9)" filter="url(#glow-cyan-s9)" />
      <text x="0" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#001a20">A</text>
    </g>

    
    <circle cx="-255" cy="-16" r="24" fill="#ffffff" filter="url(#glow-intense-s9)" class="bsm-flash-s9" />

    
    <g class="classical-packet-s9">
      <rect x="-24" y="-12" width="48" height="24" rx="6" fill="#ff9800" stroke="#ffffff" stroke-width="1.2" filter="url(#glow-intense-s9)" />
      <text x="0" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="12" font-weight="900" fill="#000000">10</text>
    </g>

    
    <g transform="translate(255, -12)">
      <circle cx="0" cy="0" r="88" fill="url(#bob-glow-s9)" />
      <rect x="-155" y="-82" width="310" height="164" rx="14" fill="#14061c" stroke="#e040fb" stroke-width="1.6" stroke-opacity="0.75" />
      
      
      <rect x="-105" y="-72" width="210" height="22" rx="11" fill="#270a36" stroke="#e040fb" stroke-width="1" />
      <text x="0" y="-57" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1" fill="#e040fb">QUANTUM CORRECTION</text>

      
      <line x1="-10" y1="-4" x2="32" y2="-4" stroke="#e040fb" stroke-width="2" stroke-dasharray="4 3" />
      <polygon points="35,-4 26,-8 26,0" fill="#00ff88" />

      
      <circle cx="60" cy="-4" r="28" fill="none" stroke="#00ff88" stroke-width="1.3" stroke-dasharray="5 3" class="orbit-ccw-s9" />
      <text x="60" y="36" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#00ff88">BOB'S QUBIT</text>

      
      <text x="0" y="62" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="9.5" font-weight="bold" fill="#f3a6ff">CORRECTION GATES: I, X, Z, XZ</text>
    </g>

    
    <g class="gate-u-s9">
      <rect x="175" y="-36" width="80" height="40" rx="8" fill="#240933" stroke="#e040fb" stroke-width="2" />
      <text x="215" y="-12" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff">GATE (U)</text>
    </g>

    
    <g class="bob-init-s9">
      <circle cx="315" cy="-16" r="15" fill="#230730" stroke="#e040fb" stroke-width="2" filter="url(#glow-purple-s9)" />
      <text x="315" y="-11" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="12" font-weight="bold" fill="#ffffff">B</text>
    </g>
    <g class="bob-final-s9">
      <circle cx="315" cy="-16" r="16" fill="url(#psi-sphere-s9)" stroke="#00ff88" stroke-width="2" filter="url(#glow-intense-s9)" />
      <text x="315" y="-11" text-anchor="middle" font-family="&#39;Georgia&#39;, serif" font-style="italic" font-size="14" font-weight="bold" fill="#1a0c00">|Ψ⟩</text>
    </g>
  </g>

  
  <g transform="translate(500, 446)">
    
    <g transform="translate(-220, -44)">
      <rect x="-210" y="-27" width="420" height="54" rx="11" fill="#070e1c" stroke="#00f3ff" stroke-width="1.4" stroke-opacity="0.65" />
      <rect x="-194" y="-14" width="68" height="28" rx="7" fill="#031d2b" stroke="#00f3ff" stroke-width="1.2" />
      <text x="-160" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#00f3ff">STEP 1</text>
      <text x="-112" y="4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">Bell-State Measurement</text>
    </g>

    
    <g transform="translate(220, -44)">
      <rect x="-210" y="-27" width="420" height="54" rx="11" fill="#070e1c" stroke="#00f3ff" stroke-width="1.4" stroke-opacity="0.65" />
      <rect x="-194" y="-14" width="68" height="28" rx="7" fill="#031d2b" stroke="#00f3ff" stroke-width="1.2" />
      <text x="-160" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#00f3ff">STEP 2</text>
      <text x="-112" y="4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#9deeff">One of four possible outcomes is obtained.</text>
    </g>

    
    <g transform="translate(-220, 22)">
      <rect x="-210" y="-27" width="420" height="54" rx="11" fill="#070e1c" stroke="#ff9800" stroke-width="1.4" stroke-opacity="0.65" />
      <rect x="-194" y="-14" width="68" height="28" rx="7" fill="#241503" stroke="#ff9800" stroke-width="1.2" />
      <text x="-160" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#ff9800">STEP 3</text>
      <text x="-112" y="4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffb74d">Alice sends two Classical Bits to Bob.</text>
    </g>

    
    <g transform="translate(220, 22)">
      <rect x="-210" y="-27" width="420" height="54" rx="11" fill="#070e1c" stroke="#e040fb" stroke-width="1.4" stroke-opacity="0.65" />
      <rect x="-194" y="-14" width="68" height="28" rx="7" fill="#230730" stroke="#e040fb" stroke-width="1.2" />
      <text x="-160" y="4" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#e040fb">STEP 4</text>
      <text x="-112" y="4" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#f3a6ff">Bob applies the required Quantum Correction.</text>
    </g>
  </g>

  
  <g transform="translate(500, 560)">
    <rect x="-430" y="-22" width="860" height="44" rx="10" fill="#041c14" stroke="#00ff88" stroke-width="1.8" filter="url(#glow-cyan-s9)" />
    <text x="0" y="5" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="15" font-weight="800" letter-spacing="1" fill="#ffffff">
      RESULT: <tspan fill="#00ff88">The quantum state is reconstructed on Bob's particle.</tspan>
    </text>
  </g>
</svg>