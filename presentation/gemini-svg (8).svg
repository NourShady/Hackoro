<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    <!-- Node Glows -->
    <radialGradient id="alice-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bob-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ab47bc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ab47bc" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="fiber-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Animations for Teleportation Over Fiber */
    @keyframes fiberPulse {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes photonTravel {
      0% { transform: translate(220px, 310px); opacity: 0; scale: 0.5; }
      15% { opacity: 1; scale: 1; }
      85% { opacity: 1; scale: 1; }
      100% { transform: translate(780px, 310px); opacity: 0; scale: 0.5; }
    }

    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #00ff88); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 16px #00ff88); }
    }

    .orbit-cw { transform-origin: center; animation: spinClockwise 8s linear infinite; }
    .orbit-ccw { transform-origin: center; animation: spinCounter 12s linear infinite; }
    .pulse-badge { transform-origin: center; animation: badgePulse 3s ease-in-out infinite; }
  </style>

  <!-- Deep Space Grid Background -->
  <rect width="1000" height="650" fill="url(#bg-grad)" />
  
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650" />
  </g>

  <!-- Main Header Title -->
  <text x="500" y="45" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#ffffff" filter="url(#glow-cyan)">8. RECENT SCIENTIFIC DEVELOPMENTS</text>
  <text x="500" y="70" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="600" fill="#00ff88" letter-spacing="1.5">REAL-WORLD METROPOLITAN QUANTUM NETWORKS (2024)</text>

  <!-- ================= METROPOLITAN FIBER-OPTIC LINK (30.2 KM) ================= -->
  <g id="fiber-conduit" transform="translate(0, 0)">
    <!-- Outer Cable Shield -->
    <path d="M 220,310 C 360,200 640,420 780,310" fill="none" stroke="#0a192f" stroke-width="14" />
    <path d="M 220,310 C 360,200 640,420 780,310" fill="none" stroke="#102e4a" stroke-width="6" />

    <!-- Fiber Core Cladding Lines -->
    <path d="M 220,310 C 360,200 640,420 780,310" fill="none" stroke="#00f3ff" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

    <!-- Active Photonic Pulse Stream (Quantum Signal) -->
    <path d="M 220,310 C 360,200 640,420 780,310" fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round" filter="url(#glow-green)" style="stroke-dasharray: 800; stroke-dashoffset: 800; animation: fiberPulse 4s linear infinite;" />

    <!-- Travelling Quantum Teleportation Photons -->
    <g style="animation: photonTravel 4s ease-in-out infinite;">
      <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#glow-intense)" />
      <circle cx="0" cy="0" r="12" fill="#00ff88" opacity="0.4" filter="url(#glow-green)" />
    </g>
    <g style="animation: photonTravel 4s ease-in-out infinite 2s;">
      <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#glow-intense)" />
      <circle cx="0" cy="0" r="12" fill="#00f3ff" opacity="0.4" filter="url(#glow-cyan)" />
    </g>
  </g>

  <!-- Central Distance & Milestone Badge (2024 - 30.2 km) -->
  <g transform="translate(500, 310)" class="pulse-badge">
    <rect x="-110" y="-28" width="220" height="56" rx="14" fill="#03140e" stroke="#00ff88" stroke-width="2" />
    <text x="0" y="-4" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="900" fill="#00ff88" letter-spacing="1">30.2 km FIBER LINK</text>
    <text x="0" y="16" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="11" font-weight="bold" fill="#ffffff">2024 RECORD MILESTONE</text>
  </g>

  <!-- ================= LEFT NODE: TRANSMITTER (ALICE / NODE A) ================= -->
  <g transform="translate(220, 310)">
    <!-- Node Glow -->
    <circle cx="0" cy="0" r="120" fill="url(#alice-glow)" />

    <!-- Orbit Rings -->
    <ellipse cx="0" cy="0" rx="75" ry="26" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="6 4" class="orbit-cw" opacity="0.6" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="3 5" opacity="0.3" />

    <!-- Telecom Laser & Photonic Transceiver Core -->
    <circle cx="0" cy="0" r="28" fill="#041624" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan)" />
    <circle cx="0" cy="0" r="12" fill="#00f3ff" filter="url(#glow-intense)" />

    <!-- Node Header -->
    <rect x="-70" y="-130" width="140" height="26" rx="6" fill="#04121a" stroke="#00f3ff" stroke-width="1" />
    <text x="0" y="-113" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="700" fill="#00f3ff" letter-spacing="1">METRO NODE A</text>

    <!-- State Labels -->
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" text-anchor="middle">
      <text x="0" y="115" font-weight="700" fill="#00f3ff">Telecom Wavelength</text>
      <text x="0" y="133" fill="#5faec2">1550 nm Photonic State</text>
    </g>
  </g>

  <!-- ================= RIGHT NODE: RECEIVER (BOB / NODE B) ================= -->
  <g transform="translate(780, 310)">
    <!-- Node Glow -->
    <circle cx="0" cy="0" r="120" fill="url(#bob-glow)" />

    <!-- Orbit Rings -->
    <ellipse cx="0" cy="0" rx="75" ry="26" fill="none" stroke="#ab47bc" stroke-width="1.5" stroke-dasharray="8 6" class="orbit-ccw" opacity="0.6" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#ab47bc" stroke-width="1" stroke-dasharray="3 5" opacity="0.3" />

    <!-- Single Photon Detector Core -->
    <circle cx="0" cy="0" r="28" fill="#18041a" stroke="#ab47bc" stroke-width="2" filter="url(#glow-cyan)" />
    <circle cx="0" cy="0" r="12" fill="#e040fb" filter="url(#glow-intense)" />

    <!-- Node Header -->
    <rect x="-70" y="-130" width="140" height="26" rx="6" fill="#18041a" stroke="#ab47bc" stroke-width="1" />
    <text x="0" y="-113" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="700" fill="#e040fb" letter-spacing="1">METRO NODE B</text>

    <!-- State Labels -->
    <g font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" text-anchor="middle">
      <text x="0" y="115" font-weight="700" fill="#e040fb">Quantum State Reassembled</text>
      <text x="0" y="133" fill="#b388ff">Fidelity > 90% Verification</text>
    </g>
  </g>

  <!-- ================= ARABIC / ENGLISH SUMMARY PANEL ================= -->
  <g transform="translate(500, 575)">
    <rect x="-420" y="-24" width="840" height="46" rx="8" fill="#050a14" stroke="#1a2d48" stroke-width="1.5" />
    
    <!-- Arabic Description Line -->
    <text x="0" y="-5" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#00ff88">
      تجربة النقل الكمي الفعلي عبر الألياف الضوئية الممتدة لمسافة 30.2 كم (إنجاز عام 2024)
    </text>
    
    <!-- English Scientific Context Line -->
    <text x="0" y="13" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-size="10" fill="#7d9ec0">
      Real-world Quantum Teleportation deployed over deployed metropolitan optical fibers without noise disruption
    </text>
  </g>
</svg>