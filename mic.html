<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Mic to Speaker</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #111;
      color: white;
      padding: 2em;
    }
    button {
      font-size: 1.5em;
      padding: 1em 2em;
      margin-top: 2em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🎤 Live Mic to Speaker</h1>
  <p>Click below to start broadcasting your mic to speakers:</p>
  <button onclick="startMic()">Start Mic</button>
  <script>
    async function startMic() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(stream);
        const gainNode = audioContext.createGain();
        gainNode.gain.value = 2.0; // Amplify if needed
        source.connect(gainNode);
        gainNode.connect(audioContext.destination);
        alert("Microphone is now live through speakers!");
      } catch (err) {
        alert("Error: " + err.message);
      }
    }
  </script>
</body>
</html>
