<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Training Course</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background-color: #0d0d0d;
        color: #fff;
        font-family: 'Segoe UI', sans-serif;
        padding: 20px;
    }
    h1, h2 {
        text-align: center;
        color: #00bfff;
        margin-top: 30px;
        margin-bottom: 20px;
    }
    .accordion-button {
        background-color: #111 !important;
        color: white !important;
        border: none;
    }
    .accordion-button:not(.collapsed) {
        background-color: #00bfff !important;
        color: black !important;
    }
    iframe {
        width: 100%;
        border-radius: 10px;
    }
    .pdf-viewer {
        height: 500px;
        border: none;
    }
    .episode-desc {
        font-size: 0.9rem;
        color: #ccc;
        margin-top: 5px;
    }
</style>
</head>
<body>

<h1>Photoshop Training Course</h1>

<!-- Videos Section -->
<h2>🎥 Episodes</h2>
<div class="accordion" id="videoAccordion"></div>

<!-- PDFs Section -->
<h2>📄 PDF Resources</h2>
<div class="accordion" id="pdfAccordion">
      <div class="accordion-item bg-dark border-0 mb-2">
            <h2 class="accordion-header" id="pHeading255">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#pCollapse255">
                   Training Assets
                </button>
            </h2>
            <div id="pCollapse255" class="accordion-collapse collapse" data-bs-parent="#pdfAccordion">
                <div class="accordion-body">
                 <button class="btn btn-primary" onclick="window.location='https://drive.google.com/drive/folders/1BLcTzGS1Lqvwo5QJV6RNBrHq7ADfuIpP'"> Download - Training Assets</button>
                </div>
            </div>
        </div>
</div>

<script>
// ======== Your videos data ========
const videos = [
    {
        title: "Episode 1: Layers and Auto Adjustments",
        description: "Learning about Layers And Auto Adjustments.",
        videoUrl: "MLGX4veL3IQ"
    },  
    {
        title: "Episode 2: Navigation",
        description: "Learning about Navigation Drag & Drop.",
        videoUrl: "O8P6btd_tQw"
    },
     {
        title: "Episode 3: Website Helpers",
        description: "",
        videoUrl: "BL-FbTdTOhg"
    },
      {
        title: "Episode 4: Play with text and fonts",
        description: "text, fonts, text path, text binding",
        videoUrl: "2py0tyqQFm8"
    },
    // {
    //     title: "Episode 2: Advanced Topic",
    //     description: "Deep dive into advanced concepts.",
    //     videoUrl: "https://www.youtube.com/embed/tgbNymZ7vqY"
    // }
];

// ======== Your PDFs data ========
const pdfs = [
    {
        title: "Photoshop | Shortcuts",
        pdfUrl: "https://drive.google.com/file/d/1zeK_J-O758PnxpmNZY4vqtY3eXBQkpFJ/preview"
    },
    {
        title: "Photoshop | Helpers Websites",
        pdfUrl: "https://drive.google.com/file/d/1gtT1YPVzUNrnFjHW_1l1OYN_nW5au1HW/preview"
    },

];

// ======== Generate Video Accordion ========
const videoAccordion = document.getElementById("videoAccordion");

videos.forEach((vid, index) => {
    videoAccordion.innerHTML += `
        <div class="accordion-item bg-dark border-0 mb-2">
            <h2 class="accordion-header" id="vHeading${index}">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#vCollapse${index}">
                    ${vid.title}
                </button>
            </h2>
            <div id="vCollapse${index}" class="accordion-collapse collapse" data-bs-parent="#videoAccordion">
                <div class="accordion-body">
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/${vid.videoUrl}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                  
                    <p class="episode-desc">${vid.description}</p>
                </div>
            </div>
        </div>
    `;
});

// ======== Generate PDF Accordion ========
const pdfAccordion = document.getElementById("pdfAccordion");

pdfs.forEach((doc, index) => {
    pdfAccordion.innerHTML += `
        <div class="accordion-item bg-dark border-0 mb-2">
            <h2 class="accordion-header" id="pHeading${index}">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#pCollapse${index}">
                    ${doc.title}
                </button>
            </h2>
            <div id="pCollapse${index}" class="accordion-collapse collapse" data-bs-parent="#pdfAccordion">
                <div class="accordion-body">
                    <iframe class="pdf-viewer" src="${doc.pdfUrl}"></iframe>
                </div>
            </div>
        </div>
    `;
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
